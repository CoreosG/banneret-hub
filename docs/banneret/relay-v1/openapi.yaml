openapi: 3.1.0
info:
  title: Relay protocol v1
  version: "1"
  summary: The calls a Banneret Hub server makes to a central relay.
  description: |
    Every call starts from a Hub or a pool host agent. The relay never dials a machine and cannot run anything on one.
    Conventions (auth, signing, errors, paging, ids) are in README.md next to this file; the schema
    descriptions below repeat the binding parts.
  license:
    name: MIT
    identifier: MIT
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /relay/v1
security:
  - deviceToken: []
tags:
  - name: discovery
  - name: enrolment
  - name: machines
  - name: facts
  - name: needs
  - name: repositories
  - name: board
  - name: feed
  - name: events
  - name: chat
  - name: snapshot
  - name: pool
paths:
  /pool/founder:
    get:
      tags:
      - pool
      operationId: getPoolFounderView
      parameters:
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolFounderView'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - pool
      operationId: managePool
      parameters:
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolFounderAction'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolFounderView'
        default:
          $ref: '#/components/responses/Error'
  /pool:
    get:
      tags:
      - pool
      operationId: getPool
      parameters:
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolView'
        default:
          $ref: '#/components/responses/Error'
  /pool/workspaces:
    post:
      tags:
      - pool
      operationId: requestPoolWorkspace
      parameters:
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolWorkspaceRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolWorkspace'
        default:
          $ref: '#/components/responses/Error'
  /pool/sandboxes:
    post:
      tags:
      - pool
      operationId: requestPoolSandbox
      parameters:
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolSandboxRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolSandbox'
        default:
          $ref: '#/components/responses/Error'
  /pool/sandboxes/{id}:
    get:
      tags:
      - pool
      operationId: getPoolSandbox
      parameters:
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      - in: path
        name: id
        required: true
        schema: { $ref: "#/components/schemas/Id" }
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolSandbox'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - pool
      operationId: cancelPoolSandbox
      parameters:
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      - in: path
        name: id
        required: true
        schema: { $ref: "#/components/schemas/Id" }
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolSandbox'
        default:
          $ref: '#/components/responses/Error'
  /pool/sandboxes/{id}/extend:
    post:
      tags:
      - pool
      operationId: extendPoolSandbox
      parameters:
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      - in: path
        name: id
        required: true
        schema: { $ref: "#/components/schemas/Id" }
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolSandbox'
        default:
          $ref: '#/components/responses/Error'
