      - readSeq
      - unread
      - mentions
      properties:
        member:
          type: boolean
        notify:
          type: string
          enum:
          - all
          - mentions
          - nothing
        muted:
          type: boolean
        readSeq:
          type: integer
          minimum: 0
        unread:
          type: integer
          minimum: 0
        mentions:
          type: integer
          minimum: 0
    ChatConversation:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - kind
        - name
        - private
        - id
        - purpose
        - agents
        - memberCount
        - archived
        - lastSeq
        - me
        properties:
          kind:
            type: string
            enum:
            - channel
          name:
            type: string
            pattern: ^[a-z0-9][a-z0-9-]{0,39}$
          private:
            type: boolean
          id:
            $ref: '#/components/schemas/Id'
          purpose:
            type: string
            maxLength: 250
          agents:
            type: string
            enum:
            - allowed
            - mentions_only
            - 'off'
          memberCount:
            type: object
            additionalProperties: false
            required:
            - people
            - agents
            properties:
              people:
                type: integer
                minimum: 0
              agents:
                type: integer
                minimum: 0
          archived:
            type: boolean
          lastSeq:
            type: integer
            minimum: 0
          me:
            $ref: '#/components/schemas/ChatMe'
      - type: object
        additionalProperties: false
        required:
        - kind
        - private
        - members
        - agentReaders
        - id
        - purpose
        - agents
        - memberCount
        - archived
        - lastSeq
        - me
        properties:
          kind:
            type: string
            enum:
            - dm
          private:
            const: true
          members:
            type: array
            items:
              $ref: '#/components/schemas/ChatMember'
            minItems: 2
            maxItems: 8
          agentReaders:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
              - personId
              - login
              properties:
                personId:
                  $ref: '#/components/schemas/Id'
                login:
                  $ref: '#/components/schemas/Login'
          id:
            $ref: '#/components/schemas/Id'
          purpose:
            type: string
            maxLength: 250
          agents:
            type: string
            enum:
            - allowed
            - mentions_only
            - 'off'
          memberCount:
            type: object
            additionalProperties: false
            required:
            - people
            - agents
            properties:
              people:
                type: integer
                minimum: 0
              agents:
                type: integer
                minimum: 0
          archived:
            type: boolean
          lastSeq:
            type: integer
            minimum: 0
          me:
            $ref: '#/components/schemas/ChatMe'
    ChatCard:
      type: object
      additionalProperties: false
      required:
      - title
      - tone
      - fields
      - links
      properties:
        title:
          type: string
        tone:
          type: string
          enum:
          - ok
          - warn
          - error
          - info
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - label
            - value
            properties:
              label:
                type: string
              value:
                type: string
          maxItems: 6
        links:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - label
            - url
            properties:
              label:
                type: string
              url:
                type: string
                format: uri-reference
                pattern: '^(https://[^/ ]+|/relay/v1/tasks/[A-Za-z0-9_-]{1,64}$)'
          maxItems: 4
    ChatProgress:
      type: object
      additionalProperties: false
      required:
      - state
      - steps
      properties:
        state:
          type: string
          enum:
          - working
          - stale
          - done
          - blocked
          - stopped
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - title
            - state
            properties:
              title:
                type: string
              state:
                type: string
          maxItems: 12
    ChatAsk:
      if: { properties: { state: { const: answered } } }
      then: { required: [answerMessageId] }
      else: { not: { required: [answerMessageId] } }
      type: object
      additionalProperties: false
      required:
      - id
      - to
      - choices
      - state
      properties:
        id:
          $ref: '#/components/schemas/Id'
        to:
          $ref: '#/components/schemas/ChatPerson'
        choices:
          anyOf: [{ maxItems: 0 }, { minItems: 2 }]
          type: array
          items:
            type: string
          maxItems: 5
        state:
          type: string
          enum:
          - open
          - answered
          - cancelled
          - expired
          - orphaned
        answerMessageId:
          $ref: '#/components/schemas/Id'
    ChatAuthor:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - kind
        - id
        - login
        properties:
          kind:
            type: string
            enum:
            - person
          id:
            $ref: '#/components/schemas/Id'
          login:
            $ref: '#/components/schemas/Login'
      - type: object
        additionalProperties: false
        required:
        - kind
        - id
        - handle
        - ownerLogin
        - provider
        properties:
          kind:
            type: string
            enum:
            - agent
          id:
            $ref: '#/components/schemas/Id'
          handle:
            type: string
          ownerLogin:
            $ref: '#/components/schemas/Login'
          provider:
            type: string
      - type: object
        additionalProperties: false
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - system
    ChatMessage:
      allOf:
        - if: { properties: { kind: { const: progress } } }
          then: { required: [progress] }
          else: { not: { required: [progress] } }
        - if: { properties: { kind: { const: ask } } }
          then: { required: [ask] }
          else: { not: { required: [ask] } }
        - if: { properties: { kind: { const: system } } }
          then: { required: [systemEvent], properties: { author: { properties: { kind: { const: system } } } } }
          else: { not: { anyOf: [{ required: [systemEvent] }, { properties: { author: { properties: { kind: { const: system } } } } }] } }
        - if: { properties: { deleted: { const: true } } }
          then: { properties: { text: { const: "" }, mentions: { maxItems: 0 } }, not: { required: [card] } }
      type: object
      additionalProperties: false
      required:
      - id
      - conversationId
      - seq
      - author
      - kind
      - text
      - mentions
      - replyCount
      - reactions
      - createdAt
      - deleted
      properties:
        id:
          $ref: '#/components/schemas/Id'
        conversationId:
          $ref: '#/components/schemas/Id'
        threadRootId:
          $ref: '#/components/schemas/Id'
        seq:
          type: integer
          minimum: 0
        author:
          $ref: '#/components/schemas/ChatAuthor'
        kind:
          type: string
          enum:
          - text
          - progress
          - ask
          - system
        text:
          type: string
          maxLength: 16384
        card:
          $ref: '#/components/schemas/ChatCard'
        systemEvent:
          type: string
        progress:
          $ref: '#/components/schemas/ChatProgress'
        ask:
          $ref: '#/components/schemas/ChatAsk'
        taskRef:
          $ref: '#/components/schemas/Id'
        mentions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - id
            properties:
              kind:
                type: string
                enum:
                - person
                - agent
              id:
                $ref: '#/components/schemas/Id'
          maxItems: 50
        replyCount:
          type: integer
          minimum: 0
        lastReplyAt:
          $ref: '#/components/schemas/Timestamp'
        reactions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - emoji
            - count
            - mine
            properties:
              emoji:
                type: string
              count:
                type: integer
                minimum: 0
              mine:
                type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        editedAt:
          $ref: '#/components/schemas/Timestamp'
        deleted:
          type: boolean
