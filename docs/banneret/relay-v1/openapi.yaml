  /hooks/{sourceId}:
    post:
      operationId: receiveAlarm
      security: [{ alarmSignature: [] }]
      description: Per-source HMAC-SHA256 over timestamp, a period and raw request bytes.
      parameters:
        - { in: path, name: sourceId, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { in: header, name: X-Alarm-Timestamp, required: true, schema: { type: string } }
        - { in: header, name: X-Alarm-Signature, required: true, schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Alarm" }
      responses:
        "204": { description: Alarm recorded }
        default: { $ref: "#/components/responses/Error" }
  /capabilities:
    get:
      tags: [discovery]
      operationId: getCapabilities
      summary: What this relay offers.
      description: |
        Without an `Authorization` header the relay answers 200 with only `displayName`, `iconUrl` and `enrolment`.
        With a valid signed device token it adds `sections`, `mcpTools`, `adapters` and `me`. A call
        that sends a token which fails (revoked, unknown, badly signed) is refused with 401 and its code, such as
        `token_revoked`; it never falls back to the public document. Nothing in this document is a secret. A client renders only the sections
        listed here and ignores section kinds it does not know.
      security:
        - {}
        - deviceToken: []
      responses:
        "200":
          description: The capabilities document.
          headers:
            ETag:
              description: |
                Changes whenever the document changes. It is the strong entity tag form, `capabilitiesVersion` from
                facts responses in double quotes: `capabilitiesVersion` `c-7f3a` is sent as `ETag: "c-7f3a"`.
              schema: { type: string, pattern: '^"[^"]{1,128}"$' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /enroll/start:
    post:
      tags: [enrolment]
      operationId: startEnrolment
      summary: Start enrolling this Hub server's Enterprise workspace.
      description: |
        No `Authorization` and no `X-Banneret-Device` header. The request is signed with the private half of
        `publicKey`, with counter `0`. The response carries a short confirm code for the Hub to show, and the
        browser URL the Hub opens. In that browser the person signs in through the relay's staff directory (GitHub
        organisation members by default) and types the code shown by the Hub; the code is never placed in the URL.
        The code expires after 10 minutes, or after 5 wrong codes typed for this pairing. The browser rules
        (machine details shown, the recognition tick, the optional network identity check) are in README.md,
        "Enrolment"; their outcome is reported by `POST /enroll/poll`, never as an error here. Error responses mean
        only a malformed request (400), a missing, malformed or failing signature (401), a body over 1 MiB (413),
        rate limiting (429) or an unavailable relay (503).
      security: []
      parameters:
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrolStartRequest" }
      responses:
        "200":
          description: Pairing created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolStartResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /enroll/poll:
    post:
      tags: [enrolment]
      operationId: pollEnrolment
      summary: Read the state of a pairing; on approval, receive a fresh device token until one is used.
      description: |
        Refused and expired pairings are reported here as a 200 `state` with a `reason`. Error responses mean only
        a malformed request (400), a missing, malformed or failing signature (401), an unknown pairing id
        (404 `not_found`), a body over 1 MiB (413), rate limiting (429) or an unavailable relay (503).
        No `Authorization` and no `X-Banneret-Device` header. Signed with the pairing's key, counter `0`. Poll no
        sooner than `retryAfterMs`. After approval, every poll returns a fresh `token` until a token is used, meaning
        the relay authenticates a signed call made with it. Each fresh token replaces the one before it: only the
        latest one works, and an older one is refused with 401 `unauthenticated`. After the first call the relay
        authenticates, a poll of the same pairing answers `approved` without `token`. Hub rule: a token refused with
        401 `unauthenticated` before any call made with it has succeeded means poll again for a fresh one.
      security: []
      parameters:
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrolPollRequest" }
      responses:
        "200":
          description: Current pairing state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolPollResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /machines:
    get:
      tags: [machines]
      operationId: listMachines
      summary: The Team machines list.
      description: |
        Every enrolled person sees every live (not revoked) machine of the relay, whoever owns it. A revoked machine
        is listed only to its owner and to founders, with `revokedAt` set; everyone else never sees it. Live machines
        come first, newest heartbeat first (machines never heard from last); revoked machines follow, most recently
        revoked first.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of machines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachinesPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /machines/{machineId}:
    delete:
      tags: [machines]
      operationId: revokeMachine
      summary: Revoke a machine.
      description: |
        Allowed for the machine's owner and for a founder. The machine's token is refused within 1 minute, open
        event streams from it are closed, and it leaves the Machines list of everyone except its owner and
        founders. Revoking is final; the machine enrols again to return. Revoking an already revoked machine
        answers 204. A `machineId` that is malformed (not an `Id`) or unknown answers 404 `not_found`; this call
        never answers 400.
      parameters:
        - name: machineId
          in: path
          required: true
          description: The machine's id. Not validated as an `Id` up front; a malformed value is 404 `not_found`.
          schema: { type: string }
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /facts:
    post:
      tags: [facts]
      operationId: postFacts
      summary: The heartbeat, carrying machine facts and activity facts.
      description: |
        Sent every 30 seconds and on any change. Each heartbeat carries the full current set of the machine's
        sessions; a session missing from a heartbeat has ended. A machine is "not heard from" after 90 seconds
        without a heartbeat. The body is closed: unknown fields are refused with `malformed`. It never carries
        prompts, replies, code, command text, titles, local paths or file contents. A `machine.environmentId` other
        than the environment the token's machine enrolled is refused with 403 `forbidden`. A body over 1 MiB is
        refused with 413 `too_large`.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactsRequest" }
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /today:
    get:
      tags: [needs]
      operationId: getToday
      summary: Today blocks for the caller.
      description: |
        Blocks, in this order: needs you, shipped since the last visit, working now, stuck and optional health. Each block has
        its own state; one broken source affects only its own block. A block holds at most 20 items; the needs-you
        block's `nextCursor` continues in `GET /needs`.

        The optional since filter selects pull requests merged strictly after the timestamp.
        The relay must never store the filter or log the query string.
      parameters:
        - name: since
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Timestamp" }
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
      responses:
        "200":
          description: Today.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Today" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /repositories:
    get:
      tags: [repositories]
      operationId: listRepositories
      summary: The company's repository list.
      description: |
        The repositories the company's workspaces are made of, in the order the relay holds them. The Hub hashes the
        git remote of each local project into a `projectKey` (see `ActivityFact`) and matches it against this list;
        no path or remote is ever sent to the relay.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of repositories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoriesPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /needs:
    get:
      tags: [needs]
      operationId: listNeeds
      summary: Needs-you items for the caller.
      description: |
        Pending questions and approvals in the caller's threads, pull requests waiting on a human, questions for a
        founder, mentions and dispatcher suggestions. Most urgent first: ordered by class, then oldest `createdAt`
        first within a class (ties in the order the relay recorded them). The classes, most urgent first, and the
        kinds in each:
          1. an agent blocked on the caller: `chat_ask`, `thread_question`, `thread_approval`;
          2. something waiting on the caller's review or decision: `pull_request`, `pr_approval`, `waiting_for_approver`, `promotion`, `founder_question`,
             `health`;
          3. a mention, or an agent or persona writing to the caller: `mention`, `agent_message` (an agent's message
             in the person's inbox), `persona_ask` (a persona asking the person something);
          4. a dispatcher suggestion: `suggestion`;
          5. any kind not listed here, including `other`, the explicit catch-all.
        Today's needs-you block uses the same order, so its `nextCursor` continues it here.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of needs-you items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NeedsPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /feed:
    get:
      tags: [feed]
      operationId: listFeed
      summary: Older feed entries, newest first.
      description: |
        Served by a relay that advertises the `feed` section. The snapshot `feed` file holds the latest
        100 entries; this call pages through the same list from where the file stops, using the file's `nextCursor`.
        Entries are derived from tracker and relay events, never written by a client. A cursor the relay did not issue
        is 400 `malformed`.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of feed entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /graveyard:
    get:
      tags: [feed]
      operationId: listGraveyard
      summary: Older graveyard entries, newest ruling first.
      description: |
        Served by a relay that advertises the `feed` section with the flag `graveyard`. The snapshot
        `graveyard` file holds the latest 100 entries; this call continues from the file's `nextCursor`.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of graveyard entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraveyardPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}:
    get:
      tags: [board]
      operationId: readTask
      summary: One task, with its preview and its checked sign-off.
      description: |
        Served by a relay that advertises the `task` section. Returns the board card for the task plus
        `preview` and `checked` when they exist. The Hub uses it when the task is not in a `board.<id>` or the `map` file
        it holds. A `taskId` that is malformed (not an `Id`) or unknown answers 404 `not_found`; this call never
        answers 400.
      parameters:
        - name: taskId
          in: path
          required: true
          description: The task's id. Not validated as an `Id` up front; a malformed value is 404 `not_found`.
          schema: { type: string }
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRead" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Server-sent events for the caller.
      description: |
        `text/event-stream`. Each replayable event has an `id:` line, an `event:` line naming one of `x-sse-events` below, and
        one `data:` line holding the JSON payload. Without `Last-Event-ID` the stream is live only: it starts with
        the next event. With `Last-Event-ID` the relay replays the caller's events after that id, reaching back
        over the smaller of the last 1000 events and the last 24 hours. When the relay no longer holds every event
        after that id, or does not know the id, it sends one `reset` event instead of a replay, then continues live; on `reset` the client refetches
        `GET /today`, `GET /needs` and `GET /capabilities`. A comment line (`:`) is sent every 25 seconds. Only `mention` and `chat.changed` may carry content. Chat events omit the id and bypass replay.
        On reconnect read /chat/changes and /chat/deliveries. The stream is closed when the machine is
        revoked or its person is removed.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      x-sse-events:
        chat.changed: { $ref: "#/components/schemas/ChatChangedEvent" }
        chat.delivery: { $ref: "#/components/schemas/ChatDeliveryEvent" }
        needs.changed: { $ref: "#/components/schemas/NeedsChangedEvent" }
        mention: { $ref: "#/components/schemas/MentionEvent" }
        bundle.changed: { $ref: "#/components/schemas/BundleChangedEvent" }
        staff.removed: { $ref: "#/components/schemas/StaffRemovedEvent" }
        capabilities.changed: { $ref: "#/components/schemas/CapabilitiesChangedEvent" }
        reset: { $ref: "#/components/schemas/ResetEvent" }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /snapshot/head:
    get:
      tags: [snapshot]
      operationId: getSnapshotHead
      summary: The caller's current snapshot head.
      description: |
        The head names the caller's current snapshot files by SHA-256. It is per person:
        every machine of one person gets the same head. It is current when served. The relay re-checks
        time-dependent facts (a machine counts as connected only while heard within 90 seconds; a thread need
        counts only on a machine heard within 90 seconds) at least every 30 seconds. When it cannot produce a
        current head, it answers 503, never a stale one. `If-None-Match` with the current `ETag` gets 304 with no
        body. Reading the head is never a Today visit.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - name: If-None-Match
          in: header
          required: false
          description: One or more entity tags, comma-separated. Any tag equal to the current `ETag` gets 304.
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: The current head.
          headers:
            ETag:
              description: Strong tag `"sha256:<hex>"` of the exact head body. Changes only when the head changes.
              schema: { type: string, pattern: '^"sha256:[0-9a-f]{64}"$' }
            Cache-Control:
              schema: { type: string, const: "private, no-cache" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotHead" }
        "304":
          description: Unchanged. No body. Carries the same `ETag` and `Cache-Control`.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /snapshot/files/{sha256}:
    get:
      tags: [snapshot]
      operationId: getSnapshotFile
      summary: One immutable snapshot file.
      description: |
        `sha256` is the lowercase hex of the file's SHA-256, which is the value in the head
        without its `sha256:` prefix. The body's SHA-256 always equals it, and a client may check this. A file is
        served only while one of the caller's retained heads names it (see README, Snapshot). A malformed, unknown,
        expired or someone else's hash all get the same 404 `not_found`, never 400. On 404 the client refetches the
        head once.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - name: sha256
          in: path
          required: true
          schema: { type: string }
          description: Expected `^[0-9a-f]{64}$`. Anything else answers 404, not 400.
      responses:
        "200":
          description: |
            The file. Its schema is the one its head key names: `needs` is SnapshotNeeds, `health` is HealthBlock,
            `work` is SnapshotWork, `machines` is SnapshotMachines, `repositories` is SnapshotRepositories, `boards` is
            SnapshotBoards, each `board.<id>` is SnapshotBoard, `map` is SnapshotMap, `feed` is FeedPage, `graveyard` is GraveyardPage. The head key decides the schema, not the body (an empty list matches more than one branch, hence `anyOf`).
          headers:
            ETag:
              schema: { type: string, pattern: '^"sha256:[0-9a-f]{64}"$' }
            Cache-Control:
              schema: { type: string, const: "private, max-age=31536000, immutable" }
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: "#/components/schemas/SnapshotNeeds" }
                  - { $ref: "#/components/schemas/HealthBlock" }
                  - { $ref: "#/components/schemas/SnapshotWork" }
                  - { $ref: "#/components/schemas/SnapshotMachines" }
                  - { $ref: "#/components/schemas/SnapshotRepositories" }
                  - { $ref: "#/components/schemas/SnapshotBoards" }
                  - { $ref: "#/components/schemas/SnapshotBoard" }
                  - { $ref: "#/components/schemas/SnapshotMap" }
                  - { $ref: "#/components/schemas/FeedPage" }
                  - { $ref: "#/components/schemas/GraveyardPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    alarmSignature:
      type: apiKey
      in: header
      name: X-Alarm-Signature
      description: Lowercase hexadecimal HMAC-SHA256 of the timestamp, period and raw body.
    deviceToken:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <device token>`. Opaque, bound to one machine (one Hub server environment) and its
        person. Every call that carries it is also signed with the machine key (see the signature parameters).
  parameters:
    Device:
      name: X-Banneret-Device
      in: header
      required: true
      description: The relay's machine id for the caller, as returned on enrolment.
      schema: { $ref: "#/components/schemas/Id" }
    Counter:
      name: X-Banneret-Counter
      in: header
      required: true
      description: |
        Decimal integer of 1–19 digits, at most 9223372036854775807 (the int64 maximum); anything else is
        refused with `bad_signature`. `0` on enrolment calls. Otherwise time-based: the Hub's Unix time in
        milliseconds times 1000, plus a sequence number 0–999 that resets each millisecond, strictly increasing per
        machine, so a restarted Hub never reuses one. The relay keeps the 256 highest counters it accepted from
        the machine. It refuses, with `counter_reused`, a counter equal to one of them or below the lowest of them,
        and accepts any other. While it holds fewer than 256, it accepts any counter that is not a repeat.
      schema: { type: string, pattern: "^(0|[1-9][0-9]{0,18})$" }
    SentAt:
      name: X-Banneret-Sent-At
      in: header
      required: true
      description: |
        RFC 3339 UTC time of sending; refused with `clock_skew` when more than 2 minutes from the relay's clock, and
        with `bad_signature` when missing or malformed.
      schema: { $ref: "#/components/schemas/Timestamp" }
    Signature:
      name: X-Banneret-Signature
      in: header
      required: true
      description: |
        Standard base64 (with padding) of the Ed25519 signature, by the machine key, over the bytes
        `"relay/v1\n" + METHOD + "\n" + TARGET + "\n" + DEVICE + "\n" + COUNTER + "\n" + SENT_AT + "\n" + BODY`,
        where TARGET is the request target exactly as sent by the Hub (path and, when there is one, `?` and the
        query, byte for byte; proxies, including Tailscale Serve path mounts, must not rewrite it), DEVICE is the
        `X-Banneret-Device` value (empty on enrolment calls), COUNTER and SENT_AT are the header values as sent,
        and BODY is the exact request body bytes (empty when there is none). A missing or malformed signature
        header, like a missing or malformed counter or sending time, is refused with 401 `bad_signature`; a
        well-formed signature that does not verify is refused with `signature_invalid`.
      schema: { type: string, pattern: "^[A-Za-z0-9+/]{86}==$" }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`. Absent for the first page.
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    Error:
      description: |
        Any failure. 400 malformed; 401 unauthenticated, token_revoked, bad_signature, signature_invalid,
        clock_skew, counter_reused; 403 forbidden, network_identity_mismatch; 404 not_found; 413 too_large; 429 rate_limited,
        capacity (with `Retry-After`); 503 unavailable (with `Retry-After`); 500 internal.
      headers:
        Retry-After:
          description: Seconds to wait, on 429 and 503.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    PoolSizes:
      type: object
      additionalProperties: false
      required: [small, large]
      properties:
        small:
          type: object
          additionalProperties: false
          required: [cpu, memory, disk]
          properties:
            cpu: {type: integer, minimum: 0}
            memory: {type: string, pattern: '^[1-9][0-9]{0,8}[KMG]$'}
            disk: {type: string, pattern: '^[1-9][0-9]{0,8}[KMG]$'}
        large:
          type: object
          additionalProperties: false
          required: [cpu, memory, disk]
          properties:
            cpu: {type: integer, minimum: 0}
            memory: {type: string, pattern: '^[1-9][0-9]{0,8}[KMG]$'}
            disk: {type: string, pattern: '^[1-9][0-9]{0,8}[KMG]$'}
    PoolDirectives:
      type: array
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required: [sandboxId, offerId, action]
        properties:
          sandboxId: { $ref: '#/components/schemas/Id' }
          offerId: { $ref: '#/components/schemas/Id' }
          action: { type: string, enum: [extend, cancel] }
          endsAt: { $ref: '#/components/schemas/Timestamp' }
        if: { properties: { action: { const: extend } } }
        then: { required: [endsAt] }
        else: { not: { required: [endsAt] } }
    PoolStateRefusal:
      allOf:
      - { $ref: '#/components/schemas/Error' }
      - type: object
        required: [current]
        properties:
          current:
            type: object
            additionalProperties: false
            required: [sandboxId, state]
            properties:
              sandboxId: { $ref: '#/components/schemas/Id' }
              state: { $ref: '#/components/schemas/PoolSandbox/properties/state' }
              offerId: { $ref: '#/components/schemas/Id' }
    PoolNextResponse:
      type: object
      additionalProperties: false
      required: [offer, directives]
      properties:
        offer: { $ref: '#/components/schemas/PoolOffer' }
        directives: { $ref: '#/components/schemas/PoolDirectives' }
    PoolCeilings:
      type: object
      additionalProperties: false
      required:
      - limits
      - sizes
      properties:
        limits:
          $ref: '#/components/schemas/PoolHostLimits'
        sizes:
          $ref: '#/components/schemas/PoolSizes'
    PoolFounderAction:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - action
        - pairingId
        - code
        properties:
          action:
            type: string
            enum:
            - confirm
          pairingId:
            $ref: '#/components/schemas/Id'
          code:
            type: string
            pattern: ^[A-Z2-7]{8}$
      - type: object
        additionalProperties: false
        required:
        - action
        - pairingId
        properties:
          action:
            type: string
            enum:
            - refuse
          pairingId:
            $ref: '#/components/schemas/Id'
      - type: object
        additionalProperties: false
        required:
        - action
        - requestId
        properties:
          action:
            type: string
            enum:
            - approve
          requestId:
            $ref: '#/components/schemas/Id'
      - type: object
        additionalProperties: false
        required:
        - action
        - requested
        properties:
          action:
            type: string
            enum:
            - limits
          requested:
            $ref: '#/components/schemas/PoolCeilings'
    PoolFounderView:
      type: object
      additionalProperties: false
      required:
      - enrolments
      - hosts
      - requests
      properties:
        enrolments:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - pairingId
            - hostId
            properties:
              pairingId:
                $ref: '#/components/schemas/Id'
              hostId:
                $ref: '#/components/schemas/Id'
        hosts:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - requested
            - local
            - effective
            properties:
              requested:
                $ref: '#/components/schemas/PoolCeilings'
              local:
                anyOf:
                - $ref: '#/components/schemas/PoolCeilings'
                - type: 'null'
              effective:
                anyOf:
                - $ref: '#/components/schemas/PoolCeilings'
                - type: 'null'
        requests:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - requestId
            - hostId
            - personId
            - state
            properties:
              requestId:
                $ref: '#/components/schemas/Id'
              hostId:
                $ref: '#/components/schemas/Id'
              personId:
                $ref: '#/components/schemas/Id'
              state:
                type: string
                enum:
                - asked
                - approved
    PoolPolicy:
      type: object
      required: [directives]
      properties:
        directives: { $ref: '#/components/schemas/PoolDirectives' }
      allOf: [{ $ref: '#/components/schemas/PoolLimitsPolicy' }]
      unevaluatedProperties: false
    PoolLimitsPolicy:
      type: object
      required: [warnings, limits, sizes]
      properties:
        warnings: { $ref: "#/components/schemas/PoolWarnings" }
        limits: { $ref: "#/components/schemas/PoolHostLimits" }
        sizes: { $ref: "#/components/schemas/PoolSizes" }
    PoolSlots:
      type: object
      additionalProperties: false
      required: [small, large]
      properties: {small: {type: integer, minimum: 0}, large: {type: integer, minimum: 0}}
    PoolHostLimits:
      type: object
      additionalProperties: false
      required: [id, level, workspaces, sandbox_slots]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        level: {type: string, enum: [staff, community]}
        workspaces:
          type: object
          additionalProperties: false
          required: [max, each]
          properties:
            max: {type: integer, minimum: 0}
            each:
              type: object
              additionalProperties: false
              required: [cpu, memory_floor, memory_max, disk, tasks]
              properties:
                cpu: {type: integer, minimum: 0}
                memory_floor: {type: string, pattern: '^[1-9][0-9]{0,8}[KMG]$'}
                memory_max: {type: string, pattern: '^[1-9][0-9]{0,8}[KMG]$'}
                disk: {type: string, pattern: '^[1-9][0-9]{0,8}[KMG]$'}
                tasks: {type: integer, minimum: 0}
        sandbox_slots: {$ref: '#/components/schemas/PoolSlots'}
    PoolWarnings:
      type: object
      additionalProperties: false
      required: [quota_percent, memory_percent, cpu_throttled_percent, pids_percent, pressure, host_busy]
      properties:
        quota_percent: {type: number, minimum: 0, maximum: 100}
        memory_percent: {type: number, minimum: 0, maximum: 100}
        cpu_throttled_percent: {type: number, minimum: 0, maximum: 100}
        pids_percent: {type: number, minimum: 0, maximum: 100}
        pressure:
          type: object
          additionalProperties: false
          required: [cpu, memory, io]
          properties:
            cpu: {type: number, minimum: 0, maximum: 100}
            memory: {type: number, minimum: 0, maximum: 100}
            io: {type: number, minimum: 0, maximum: 100}
        host_busy:
          type: object
          additionalProperties: false
          required: [memory_full_avg60, io_some_avg60, cpu_some_avg60]
          properties:
            memory_full_avg60: {type: number, minimum: 0, maximum: 100}
            io_some_avg60: {type: number, minimum: 0, maximum: 100}
            cpu_some_avg60: {type: number, minimum: 0, maximum: 100}
    PoolConfig:
      type: object
      additionalProperties: false
      required: [enabled, hosts, warnings, sandboxes]
      properties:
        enabled: {type: boolean}
        hosts: {type: array, items: {$ref: '#/components/schemas/PoolHostLimits'}}
        warnings: {$ref: '#/components/schemas/PoolWarnings'}
        sandboxes:
          type: object
          additionalProperties: false
          required: [sizes, time_limit, idle_limit, extend, per_person, images]
          properties:
            sizes: { $ref: "#/components/schemas/PoolSizes" }
            time_limit: {type: string, pattern: '^[1-9][0-9]*[smh]$'}
            idle_limit: {type: string, pattern: '^[1-9][0-9]*[smh]$'}
            extend: {type: string, pattern: '^[1-9][0-9]*[smh]$'}
            per_person:
              type: object
              additionalProperties: false
              required: [running, waiting]
              properties: {running: {type: integer, minimum: 0}, waiting: {type: integer, minimum: 0}}
            images:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, digest]
                properties:
                  name: {$ref: '#/components/schemas/Id'}
                  digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    PoolMeter:
      type: object
      additionalProperties: false
      required: [used, limit, warn]
      properties:
        used: {type: integer, minimum: 0}
        limit: {anyOf: [{type: integer, minimum: 0}, {type: 'null'}]}
        warn: {type: boolean}
    PoolPsi:
      type: object
      additionalProperties: false
      required: [some, full]
      properties:
        some:
          type: object
          additionalProperties: false
          required: [avg10, avg60]
          properties:
            avg10: {type: number, minimum: 0, maximum: 100}
            avg60: {type: number, minimum: 0, maximum: 100}
        full:
          type: object
          additionalProperties: false
          required: [avg10, avg60]
          properties:
            avg10: {type: number, minimum: 0, maximum: 100}
            avg60: {type: number, minimum: 0, maximum: 100}
    PoolQuota:
      type: object
      additionalProperties: false
      required: [notMeasured, disk, inodes, warnings]
      properties:
        notMeasured:
          anyOf:
          - {type: string, enum: [macos, windows, missing_files]}
          - {type: 'null'}
        disk: {anyOf: [{$ref: '#/components/schemas/PoolMeter'}, {type: 'null'}]}
        inodes: {anyOf: [{$ref: '#/components/schemas/PoolMeter'}, {type: 'null'}]}
        warnings:
          type: object
          additionalProperties: false
          required: [memory, cpu, pids, pressure]
          properties:
            memory: {type: boolean}
            cpu: {type: boolean}
            pids: {type: boolean}
            pressure: {type: boolean}
    Resources:
      type: object
      additionalProperties: false
      required: [measuredAt, notMeasured, disk, inodes, memory, cpu, pids, pressure]
      properties:
        measuredAt: {$ref: '#/components/schemas/Timestamp'}
        notMeasured:
          anyOf:
          - {type: string, enum: [macos, windows, missing_files]}
          - {type: 'null'}
        disk: {anyOf: [{$ref: '#/components/schemas/PoolMeter'}, {type: 'null'}]}
        inodes: {anyOf: [{$ref: '#/components/schemas/PoolMeter'}, {type: 'null'}]}
        memory:
          anyOf:
          - type: object
            additionalProperties: false
            required: [used, limit, floor, oomKills, warn]
            properties:
              used: {type: integer, minimum: 0}
              limit: {anyOf: [{type: integer, minimum: 0}, {type: 'null'}]}
              floor: {type: integer, minimum: 0}
              oomKills: {type: integer, minimum: 0}
              warn: {type: boolean}
          - {type: 'null'}
        cpu:
          anyOf:
          - type: object
            additionalProperties: false
            required: [throttledPercent, quotaUsec, periodUsec, warn]
            properties:
              throttledPercent: {type: number, minimum: 0, maximum: 100}
              quotaUsec: {anyOf: [{type: integer, minimum: 0}, {type: 'null'}]}
              periodUsec: {type: integer, minimum: 0}
              warn: {type: boolean}
          - {type: 'null'}
        pids: {anyOf: [{$ref: '#/components/schemas/PoolMeter'}, {type: 'null'}]}
        pressure:
          type: object
          additionalProperties: false
