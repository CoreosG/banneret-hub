      - nextCursor
      properties:
        root:
          $ref: '#/components/schemas/ChatMessage'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        nextCursor:
          type:
          - string
          - 'null'
    ChatCreate:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - kind
        - name
        - private
        - agents
        properties:
          kind:
            type: string
            enum:
            - channel
          name:
            type: string
            pattern: ^[a-z0-9][a-z0-9-]{0,39}$
          purpose:
            type: string
            maxLength: 250
          private:
            type: boolean
          agents:
            type: string
            enum:
            - allowed
            - mentions_only
            - 'off'
      - type: object
        additionalProperties: false
        required:
        - kind
        - members
        properties:
          kind:
            type: string
            enum:
            - dm
          members:
            type: array
            items:
              $ref: '#/components/schemas/Id'
            minItems: 1
            maxItems: 8
            uniqueItems: true
    ChatPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,39}$
        purpose:
          type: string
          maxLength: 250
        private:
          type: boolean
        agents:
          type: string
          enum:
          - allowed
          - mentions_only
          - 'off'
        archived:
          type: boolean
      minProperties: 1
    ChatSettings:
      type: object
      additionalProperties: false
      required:
      - agentsReadMyDms
      properties:
        agentsReadMyDms:
          type: boolean
    ChatNotifications:
      type: object
      additionalProperties: false
      required:
      - notify
      - muted
      properties:
        notify:
          type: string
          enum:
          - all
          - mentions
          - nothing
        muted:
          type: boolean
    ChatPost:
      type: object
      additionalProperties: false
      required:
      - conversationId
      - text
      - key
      properties:
        conversationId:
          $ref: '#/components/schemas/Id'
        threadRootId:
          $ref: '#/components/schemas/Id'
        text:
          type: string
          maxLength: 16384
        card:
          $ref: '#/components/schemas/ChatCard'
        taskRef:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Id'
        asHandle:
          $ref: '#/components/schemas/Id'
    ChatEdit:
      type: object
      additionalProperties: false
      required:
      - text
      properties:
        text:
          type: string
          maxLength: 16384
        card:
          $ref: '#/components/schemas/ChatCard'
        asHandle:
          $ref: '#/components/schemas/Id'
    ChatWriteProgress:
      type: object
      additionalProperties: false
      required:
      - text
      - state
      - asHandle
      properties:
        text:
          type: string
          maxLength: 16384
        state:
          type: string
          enum:
          - working
          - done
          - blocked
          - stopped
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - title
            - state
            properties:
              title:
                type: string
              state:
                type: string
          maxItems: 12
        asHandle:
          $ref: '#/components/schemas/Id'
    ChatTask:
      type: object
      additionalProperties: false
      required:
      - taskRef
      properties:
        taskRef:
          $ref: '#/components/schemas/Id'
    ChatNewAsk:
      type: object
      additionalProperties: false
      required:
      - to
      - question
      - key
      - asHandle
      properties:
        to:
          $ref: '#/components/schemas/Id'
        question:
          type: string
          maxLength: 16384
        choices:
          type: array
          items:
            type: string
            maxLength: 80
          minItems: 2
          maxItems: 5
          uniqueItems: true
        threadRootId:
          $ref: '#/components/schemas/Id'
        taskRef:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/Id'
        asHandle:
          $ref: '#/components/schemas/Id'
    ChatAnswer:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - choice
        properties:
          choice:
            type: string
      - type: object
        additionalProperties: false
        required:
        - text
        properties:
          text:
            type: string
            maxLength: 16384
    ChatRegister:
      type: object
      additionalProperties: false
      required:
      - threadRef
      - provider
      - machineId
      properties:
        name:
          type: string
        threadRef: {type: string}
        provider:
          type: string
        machineId:
          $ref: '#/components/schemas/Id'
        wake:
          type: string
          enum:
          - everyone
          - owner_only
    ChatAct:
      type: object
      additionalProperties: false
      required:
      - asHandle
      properties:
        asHandle:
          $ref: '#/components/schemas/Id'
    ChatRefuse:
      type: object
      additionalProperties: false
      required:
      - asHandle
      - reason
      properties:
        asHandle:
          $ref: '#/components/schemas/Id'
        reason:
          type: string
    ChatPromotion:
      type: object
      additionalProperties: false
      required:
      - text
      - link
      properties:
        text:
          type: string
          maxLength: 16384
        link:
          type: string
          format: uri
          pattern: ^https?://
    ChatLimits:
      type: object
      additionalProperties: false
      required:
      - maxTextBytes
      - editWindowSeconds
      - rate
      - retentionDays
      properties:
        maxTextBytes:
          type: integer
          minimum: 0
        editWindowSeconds:
          type: integer
          minimum: 0
        rate:
          type: object
          additionalProperties: false
          required:
          - postsPerMinute
          - postsPerHour
          - openAsks
          - hopCap
          - pairPerMinute
          properties:
            postsPerMinute:
              type: integer
              minimum: 0
            postsPerHour:
              type: integer
              minimum: 0
            openAsks:
              type: integer
              minimum: 0
            hopCap:
              type: integer
              minimum: 0
            pairPerMinute:
              type: integer
              minimum: 0
        retentionDays:
          type: object
          additionalProperties: false
          required:
          - channels
          - dms
          properties:
            channels:
              type: integer
              minimum: 0
            dms:
              type: integer
              minimum: 0
    Id:
      description: An opaque id. Never a GitHub numeric id; never parsed by clients.
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
    EnvironmentId:
      description: T3's stable per-server environment id, opaque to the relay.
      type: string
      pattern: "^[A-Za-z0-9_-]{1,128}$"
    Timestamp:
      description: RFC 3339, UTC, ending in `Z`.
      type: string
      format: date-time
      pattern: "Z$"
    Login:
      description: A display login (the person's GitHub login with the default staff directory). Display only, never a key.
      type: string
      pattern: "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$"
    Role:
      description: |
        Open set. Known values: `founder`, `limited_staff`. Not a closed enum:
        clients treat an unknown role as `limited_staff` and never fail on it.
      type: string
      pattern: "^[a-z][a-z0-9_]{0,31}$"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              description: |
                Open set. Known values: `malformed`, `too_large`, `unauthenticated`, `token_revoked`,
                `bad_signature`, `signature_invalid`, `clock_skew`, `counter_reused`, `forbidden`,
                `network_identity_mismatch`, `not_found`, `rate_limited`, `capacity`, `unavailable`, `internal`.
                Not a closed enum: a client treats an unknown code by its
                HTTP status and never fails on it.
              type: string
              pattern: "^[a-z][a-z0-9_]{0,31}$"
            message: { type: string, maxLength: 500, description: Plain words for a person; never parsed. }
            retryable: { type: boolean }
            details:
              type: object
              description: Optional machine-readable detail, such as the refused field name. Never secrets.
    Capabilities:
      if:
        required: [sections]
        properties:
          sections: { contains: { required: [kind], properties: { kind: { const: chat } } } }
      then: { required: [me, chat] }
      else: { not: { required: [chat] } }
      type: object
      required: [displayName, iconUrl, enrolment]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80, description: "The company's name, for \"Join <name>\"." }
        iconUrl: { type: [string, "null"], format: uri, maxLength: 2048 }
        enrolment:
          type: object
          required: [start, browser]
          properties:
            start: { type: string, const: /relay/v1/enroll/start }
            browser:
              description: Path on the relay's origin of the page where a person confirms enrolment after signing in through the staff directory.
              type: string
              pattern: "^/"
        me:
          description: The caller. Present only for an authenticated caller.
          type: object
          required: [id, login, role]
          properties:
            id: { $ref: "#/components/schemas/Id" }
            login: { $ref: "#/components/schemas/Login" }
            role: { $ref: "#/components/schemas/Role" }
            machineId: { $ref: "#/components/schemas/Id" }
        sections:
          description: Present only for an authenticated caller. The client renders only these.
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/Section" }
        chat: { $ref: "#/components/schemas/ChatLimits" }
        dashboards: { $ref: "#/components/schemas/Dashboards" }
        mcpTools:
          description: |
            Present only for an authenticated caller. The Hub offers its agents exactly the tools named here that it
            implements (the `banneret_*` agent toolkit); for those it keeps its own description and schema, and the
            entry only switches the tool on and sets its role. A name the Hub does not implement is ignored.
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/McpTool" }
        adapters:
          description: Present only for an authenticated caller. Which adapter fills each role; never configuration or secrets.
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/Adapter" }
        snapshot:
          description: Present only for an authenticated caller on a relay that serves snapshots.
          type: object
          required: [version, head]
          properties:
            version: { type: integer, minimum: 1 }
            head: { type: string, const: /relay/v1/snapshot/head }
    Dashboards:
      type: array
      maxItems: 32
      items:
        type: object
        required: [id, title, url]
        properties:
          id: { $ref: "#/components/schemas/Id" }
          title: { type: string, minLength: 1, maxLength: 120 }
          group: { type: string, maxLength: 80 }
          url: { type: string, format: uri, pattern: "^https://[^/ ]+", maxLength: 2048 }
    LeaseClocks:
      type: object
      required: [staleSeconds, expirySeconds]
      properties:
        staleSeconds: { type: integer, minimum: 1, maximum: 31536000, default: 21600 }
        expirySeconds: { type: integer, minimum: 2, maximum: 31536000, default: 86400 }
    Alarm:
      type: object
      additionalProperties: false
      required: [id, sourceId, severity, title, firedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        sourceId: { $ref: "#/components/schemas/Id" }
        severity: { enum: [info, warning, critical] }
        title: { type: string, minLength: 1, maxLength: 300 }
        detail: { type: string, maxLength: 500 }
        url: { type: string, format: uri, pattern: "^https?://", maxLength: 2048 }
        firedAt: { $ref: "#/components/schemas/Timestamp" }
        resolvedAt: { $ref: "#/components/schemas/Timestamp" }
    Section:
      type: object
      required: [id, kind, version, flags]
      allOf:
        - if: { properties: { kind: { const: chat } } }
          then:
            properties:
              version: { const: 1 }
              flags: { type: array, uniqueItems: true, items: { enum: [channels, private_channels, dms, group_dms, threads, agents, agent_dms, agent_owner_dm_read, others_agents, task_links, reactions, search, promote] } }
        - if: { properties: { kind: { const: board } } }
          then:
            required: [params]
            properties:
              params: { $ref: "#/components/schemas/LeaseClocks" }
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind:
          description: |
            One of the fixed section types: today, needs, machines, health, board, map, feed, task, chat, team,
            knowledge, pool. Clients ignore kinds they do not know.
          not: { const: channel }
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        version: { type: integer, minimum: 1 }
        flags:
          type: array
          maxItems: 32
          items: { type: string, pattern: "^[a-z][a-z0-9_.]{0,63}$" }
    McpTool:
      type: object
      required: [name, description, role]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        description: { type: string, minLength: 1, maxLength: 500 }
        role:
          description: The lowest role that may call the tool.
          allOf: [{ $ref: "#/components/schemas/Role" }]
        inputSchema:
          description: JSON Schema (2020-12) for the tool's arguments.
          type: object
    Adapter:
      type: object
      required: [role, kind]
      properties:
        role: { type: string, enum: [work_tracker, staff_directory, knowledge, health] }
        kind:
          description: "`github`, `markdown`, `none`, or another compiled-in adapter."
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        version: { type: integer, minimum: 1 }
    MachineFacts:
      description: What a Hub server reports about itself. Closed; owner and last-heard time are set by the relay.
      type: object
      additionalProperties: false
      required: [environmentId, label, kind, hostname, os, hubVersion, policyFingerprint, sandbox]
      properties:
        environmentId: { $ref: "#/components/schemas/EnvironmentId" }
        label: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$" }
        kind: { type: string, enum: [laptop, desktop, server, cloud] }
        poolHostId: { $ref: "#/components/schemas/Id" }
        hostname: { type: string, pattern: "^[A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$" }
        os: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9 ._()-]{0,63}$" }
        hubVersion: { type: string, pattern: "^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$" }
        policyFingerprint:
          description: Fingerprint of the signed policy the machine runs, or null when it has none yet.
          oneOf:
            - { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            - { type: "null" }
        sandbox:
          type: object
          additionalProperties: false
          required: [enabled, image]
          properties:
            enabled: { type: boolean }
            image:
              description: The pinned sandbox image reference, or null.
              oneOf:
                - { type: string, pattern: "^[a-z0-9][a-z0-9._/:-]{0,190}@sha256:[0-9a-f]{64}$" }
                - { type: "null" }
    EnrolStartRequest:
      type: object
      additionalProperties: false
      required: [publicKey, machine]
      properties:
        publicKey:
          description: Standard base64 of the machine's 32-byte Ed25519 public key.
          type: string
          pattern: "^[A-Za-z0-9+/]{43}=$"
        machine: { $ref: "#/components/schemas/MachineFacts" }
    EnrolStartResponse:
      type: object
      required: [pairingId, confirmCode, browserUrl, expiresAt, state, retryAfterMs]
      properties:
        pairingId: { $ref: "#/components/schemas/Id" }
        confirmCode:
          description: Shown by the Hub; the person types it on the relay page. Never put in a URL.
          type: string
          pattern: "^[A-Z2-7]{8}$"
        browserUrl:
          description: Absolute URL on the relay's origin that the Hub opens in the person's browser.
          type: string
          format: uri
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        state: { type: string, const: pending }
        retryAfterMs: { type: integer, minimum: 0 }
    EnrolPollRequest:
      type: object
      additionalProperties: false
      required: [pairingId]
      properties:
        pairingId: { $ref: "#/components/schemas/Id" }
    EnrolPollResponse:
      type: object
      required: [pairingId, state, expiresAt, retryAfterMs]
      properties:
        pairingId: { $ref: "#/components/schemas/Id" }
        state:
          description: |
            `pending`: waiting for the person to confirm the code (at most 10 minutes). `awaiting_approval`:
            confirmed, waiting for a founder to approve a person new to the relay (at most 7 days). `approved`,
            `refused`, `expired`: final.
          type: string
          enum: [pending, awaiting_approval, approved, refused, expired]
        expiresAt:
          description: |
            The deadline of the current state: the confirm code's expiry (10 minutes after start) while `pending`,
            the approval deadline (7 days after confirmation) while `awaiting_approval`. Once `expired`, the time it
            expired: the code's expiry for `code_expired`, the approval deadline for `approval_expired`, and the time
            of the 5th wrong code for `too_many_attempts` (the 5th wrong code expires the pairing at once). Once
            `approved` or `refused`, the deadline that was current when it became final.
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
        retryAfterMs: { type: integer, minimum: 0 }
        machineId: { $ref: "#/components/schemas/Id" }
        token:
          description: |
            The device token. Once `approved`, every poll returns a fresh one until a token is used (the relay
            authenticates a signed call made with it); each fresh token replaces the one before it, so only the
            latest one works. After that first authenticated call, polls omit it.
          type: string
          minLength: 32
          maxLength: 256
        reason:
          description: |
            Why a pairing is `refused` (`declined`, `not_staff`, `network_identity_mismatch`,
            `environment_enrolled`) or `expired` (`code_expired`, `too_many_attempts`, `approval_expired`).
          type: string
          enum: [declined, not_staff, network_identity_mismatch, environment_enrolled, code_expired, too_many_attempts, approval_expired]
      allOf:
        - if: { properties: { state: { const: approved } } }
          then: { required: [machineId] }
        - if: { properties: { state: { enum: [refused, expired] } } }
          then: { required: [reason] }
          else: { not: { required: [reason] } }
        - if: { properties: { state: { const: refused } } }
          then: { properties: { reason: { enum: [declined, not_staff, network_identity_mismatch, environment_enrolled] } } }
        - if: { properties: { state: { const: expired } } }
          then: { properties: { reason: { enum: [code_expired, too_many_attempts, approval_expired] } } }
        - if: { properties: { state: { not: { const: approved } } } }
          then: { not: { anyOf: [{ required: [token] }, { required: [machineId] }] } }
    Machine:
      type: object
      required: [id, environmentId, ownerId, ownerLogin, label, kind, hostname, os, hubVersion, policyFingerprint, sandbox, enrolledAt, lastHeardAt, connected]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        environmentId: { $ref: "#/components/schemas/EnvironmentId" }
        ownerId: { $ref: "#/components/schemas/Id" }
        ownerLogin: { $ref: "#/components/schemas/Login" }
        label: { type: string }
        kind: { type: string }
        poolHostId: { $ref: "#/components/schemas/Id" }
        hostname: { type: string }
        os: { type: string }
        hubVersion: { type: string }
        policyFingerprint: { type: [string, "null"] }
        sandbox:
          type: object
          required: [enabled, image]
          properties:
            enabled: { type: boolean }
            image: { type: [string, "null"] }
        enrolledAt: { $ref: "#/components/schemas/Timestamp" }
        lastHeardAt:
          description: When the relay last accepted a heartbeat, or null before the first.
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        connected: { type: boolean, description: "False after 90 seconds without a heartbeat (\"not heard from\") and once revoked." }
        revocable: { type: boolean, description: True when the caller may revoke it; false once revoked. }
        revokedAt:
          description: When the machine was revoked. Present only on a revoked machine, which only its owner and founders see.
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
    MachinesPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Machine" } }
        nextCursor: { type: [string, "null"] }
    Repository:
      description: One repository of the company's list. Closed; no path and no remote.
      type: object
      additionalProperties: false
      required: [projectKey, name]
      properties:
        projectKey:
          description: |
            `sha256:` plus the lowercase hex SHA-256 of the normalised repository identity `host/owner/name`, the same
            hash as `ActivityFact.projectKey`.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        name: { description: "Display string `owner/name`.", type: string, pattern: "^[^/\\s]{1,100}/[^/\\s]{1,100}$" }
        url:
          description: Link to the repository page.
          type: string
          format: uri
          pattern: "^https://"
          maxLength: 500
    RepositoriesPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Repository" } }
        nextCursor: { type: [string, "null"] }
    ActivityFact:
      description: One agent session, reduced to facts (company hub plan §7.4). Closed; no content of any kind.
      type: object
      additionalProperties: false
      required: [sessionId, threadId, projectKey, provider, state, processRunning, startedAt, lastSeenAt]
      properties:
        sessionId:
          description: A random id made by the Hub, not the provider's own.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        parentSessionId:
          description: The parent session, for helpers.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        threadId:
          description: T3's thread id, opaque.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        projectKey:
          description: |
            `sha256:` plus the lowercase hex SHA-256 of the repository identity `host/owner/name`, lowercased,
            without scheme, credentials, port or `.git`. Never a local path. The relay hashes its own repository
            list the same way to match it.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        branch:
          description: The git branch name only.
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$"
        taskId:
          description: The relay's task id when the Hub knows it from the toolkit; otherwise the relay derives the task from the branch.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        provider: { type: string, enum: [claude, codex] }
        providerVersion: { type: string, pattern: "^[0-9A-Za-z][0-9A-Za-z.+-]{0,31}$" }
        model: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:\\[\\]-]{0,63}$" }
        persona: { type: string, pattern: "^[a-z][a-z0-9-]{0,39}$" }
        state: { type: string, enum: [working, waiting, idle, stopped] }
        waiting:
          description: What the session waits on when `state` is `waiting`.
          type: string
          enum: [permission, question, input]
        tool:
          type: object
          additionalProperties: false
          required: [name, activity]
          properties:
            name: { description: The tool's name only., type: string, pattern: "^[A-Za-z][A-Za-z0-9_.:-]{0,63}$" }
            activity:
              type: string
              enum: [running_tests, building, editing_files, reading_files, searching, running_command, fetching, delegating, planning, other]
            fileCount: { type: integer, minimum: 0, maximum: 100000 }
            since: { $ref: "#/components/schemas/Timestamp" }
        processRunning: { type: boolean }
        startedAt: { $ref: "#/components/schemas/Timestamp" }
        lastSeenAt: { $ref: "#/components/schemas/Timestamp" }
        stopReason: { type: string, enum: [completed, usage_limit, error, killed, not_reported] }
        bundleSha: { type: string, pattern: "^[0-9a-f]{40}$" }
      allOf:
        - if: { properties: { state: { const: waiting } } }
          then: { required: [waiting] }
          else: { not: { required: [waiting] } }
        - if: { properties: { state: { const: stopped } } }
          then: { required: [stopReason] }
          else: { not: { required: [stopReason] } }
    FactsRequest:
      type: object
      additionalProperties: false
      required: [machine, activity]
      properties:
        machine: { $ref: "#/components/schemas/MachineFacts" }
        activity:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/ActivityFact" }
        usage:
          description: |
            Optional. One entry per provider login on this machine and window. Only the machine owner's own logins
            are reported. Feeds per-person usage.
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/UsageFact" }
    UsageFact:
      description: How much of one usage window a provider login has used. Closed; no tokens, costs, prompts, content or account identifiers.
      type: object
      additionalProperties: false
      required: [provider, window, usedPercent, resetsAt]
      properties:
        provider:
          description: Open set. Known values `claude` and `codex`.
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        window:
          description: Open set. Known values `5h`, `weekly` and `monthly`.
          type: string
          pattern: "^[a-z0-9][a-z0-9_]{0,31}$"
        usedPercent: { type: number, minimum: 0, maximum: 100 }
        resetsAt:
          description: When the window resets (RFC 3339 UTC), or null when unknown.
          oneOf:
            - { $ref: "#/components/schemas/Timestamp" }
            - { type: "null" }
    FactsResponse:
      type: object
      required: [acceptedAt, heartbeatSeconds, capabilitiesVersion]
      properties:
        acceptedAt: { $ref: "#/components/schemas/Timestamp" }
        heartbeatSeconds: { type: integer, minimum: 5 }
        capabilitiesVersion:
          description: Refetch capabilities when this changes. Unquoted; the capabilities `ETag` is this value in double quotes.
          type: string
          maxLength: 128
        snapshotEtag:
          description: |
            The caller's current snapshot head `ETag`, unquoted. Refetch the head when it changes.
            Absent until the person has a head. Rebuilds are debounced, so a heartbeat's own response may still
            carry the previous value; the next heartbeat carries the new one.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
    DeepLink:
      description: Where the item opens in a Hub. Present only when the item belongs to a thread on a known machine.
      type: object
      required: [environmentId]
      properties:
        environmentId: { $ref: "#/components/schemas/EnvironmentId" }
        threadId: { $ref: "#/components/schemas/Id" }
    PersonRef:
      type: object
      additionalProperties: false
      required: [id, login]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        login: { $ref: "#/components/schemas/Login" }
    NeedsItem:
      if: { properties: { kind: { const: chat_ask } } }
      then: { required: [ask] }
      type: object
      required: [id, kind, title, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind:
          description: |
            Open set. Known values: `chat_ask`, `thread_question`, `thread_approval`, `pull_request`, `pr_approval`, `waiting_for_approver`, `founder_question`,
            `promotion`, `health`, `mention`, `agent_message`, `persona_ask`, `suggestion`, `other` (class 5, the explicit
            catch-all). Not a closed enum:
            a client shows an unknown kind as a generic item and never fails on it.
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        title: { type: string, maxLength: 300 }
        recommendation: { type: string, maxLength: 500 }
        chatRead: { $ref: "#/components/schemas/ChatRead" }
        ask: { $ref: "#/components/schemas/ChatAsk" }
        from: { $ref: "#/components/schemas/PersonRef" }
        url:
          description: Link out, such as the GitHub issue or pull request.
          type: string
          format: uri
        deepLink: { $ref: "#/components/schemas/DeepLink" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    NeedsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NeedsItem" } }
        nextCursor: { type: [string, "null"] }
    NotMeasured:
      type: object
      required: [source, reason, since]
      properties:
        source: { type: string, maxLength: 64 }
        reason:
          type: string
          enum: [never_read, unreachable, auth_failed, permission_missing, rate_limited, stale_publication, malformed, not_configured, too_large]
        since: { $ref: "#/components/schemas/Timestamp" }
        detail:
          description: |
            Optional. One plain sentence with the specifics, for example which stage-plan rule failed.
            Never a path or a secret.
          type: string
          maxLength: 240
    BlockState:
      type: string
      enum: [ok, partial, not_measured]
    TaskRef:
      type: object
      required: [id, title]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        title: { type: string, maxLength: 300 }
        url: { type: string, format: uri }
    Today:
      type: object
      additionalProperties: false
      required: [generatedAt, needsYou, shipped, working, stuck]
      properties:
        generatedAt: { $ref: "#/components/schemas/Timestamp" }
        needsYou: { $ref: "#/components/schemas/NeedsBlock" }
        shipped:
          type: object
          required: [state, items, notMeasured]
          properties:
            state: { $ref: "#/components/schemas/BlockState" }
            items:
              type: array
              maxItems: 20
              items:
                description: |
                  One merged pull request. `pr` is the pull request that shipped, so a client needs no board to
                  name or link it. `ref` is where the task lives in its tracker, present when the relay knows it.
                type: object
                required: [task, pr, summary, mergedAt, live]
                properties:
                  task: { $ref: "#/components/schemas/TaskRef" }
                  pr: { $ref: "#/components/schemas/ShippedPr" }
                  ref: { $ref: "#/components/schemas/BoardTaskRef" }
                  summary: { type: string, maxLength: 300 }
                  mergedAt: { $ref: "#/components/schemas/Timestamp" }
                  live: { type: string, enum: [live, not_live_yet, deploy_failed, no_deploy] }
            notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
        working: { $ref: "#/components/schemas/WorkingBlock" }
        stuck: { $ref: "#/components/schemas/StuckBlock" }
        health: { $ref: "#/components/schemas/HealthBlock" }
    ShippedPr:
      description: The pull request behind a shipped item. `repo` is the `owner/name` display string.
      type: object
      additionalProperties: false
      required: [number, url, repo]
      properties:
        number: { type: integer, minimum: 1 }
        url: { type: string, format: uri }
        repo: { type: string, minLength: 1, maxLength: 200 }
    NeedsBlock:
      description: The needs-you block, as in Today.
      type: object
      required: [state, items, nextCursor, notMeasured]
      properties:
        state: { $ref: "#/components/schemas/BlockState" }
        items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/NeedsItem" } }
        nextCursor:
          description: Continue with `GET /needs?cursor=`.
          type: [string, "null"]
        notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
    WorkingBlock:
      description: The working-now block, as in Today.
      type: object
      required: [state, items, notMeasured]
      properties:
        state: { $ref: "#/components/schemas/BlockState" }
        items:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [person]
            properties:
              person: { $ref: "#/components/schemas/PersonRef" }
              task: { $ref: "#/components/schemas/TaskRef" }
              branch: { type: string }
              sessions: { type: integer, minimum: 0 }
              state: { type: string, enum: [working, waiting, idle, stopped, not_heard_from] }
              deepLink: { $ref: "#/components/schemas/DeepLink" }
        notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
    StuckBlock:
      description: The stuck block, as in Today.
      type: object
      required: [state, items, notMeasured]
      properties:
        state: { $ref: "#/components/schemas/BlockState" }
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [rules, since]
            oneOf:
              - required: [task]
              - required: [subject]
            description: Exactly one of `task` or `subject`.
            properties:
              rules:
                description: |
                  Every stuck reason of this task and owner, most important first, in the relay's priority order
                  (README, Stuck). One item per task and owner. Never empty, never repeated.
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  enum: [dev_red, check_failed, deploy_failed, watched_job_down, unreviewed, claim_quiet, checks_queued]
              since: { $ref: "#/components/schemas/Timestamp" }
              task: { $ref: "#/components/schemas/TaskRef" }
              subject:
                description: |
                  What an item without a `task` is about. It has a repository, a watched job, or both. A watched job that
                  belongs to no repository has only `job`. An item has exactly one of `task` or `subject`. Items
                  without a task are one per subject and rule, never merged across repositories.
                type: object
                additionalProperties: false
                anyOf:
                  - required: [repo]
                  - required: [job]
                properties:
                  repo: { description: "The `owner/name` display string. No other ids.", type: string, maxLength: 200 }
                  run:
                    description: The CI run, with its URL.
                    type: object
                    additionalProperties: false
                    required: [name, url]
                    properties:
                      name: { type: string, maxLength: 200 }
                      url: { type: string, format: uri }
                  job:
                    description: The watched job. The URL is optional.
                    type: object
                    additionalProperties: false
                    required: [name]
                    properties:
                      name: { type: string, maxLength: 200 }
                      url: { type: string, format: uri }
              owner: { $ref: "#/components/schemas/PersonRef" }
              deepLink: { $ref: "#/components/schemas/DeepLink" }
        notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
    HealthBlock:
      description: The health block, as in Today. It is also the snapshot `health` file.
      type: object
      required: [state, items, alarms, notMeasured]
      properties:
        state: { $ref: "#/components/schemas/BlockState" }
        alarms: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/Alarm" } }
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, source, kind, label, state, observedAt]
            properties:
              id: { $ref: "#/components/schemas/Id" }
              source: { $ref: "#/components/schemas/Id" }
              kind: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" }
              label: { type: string, maxLength: 120 }
              state: { type: string, enum: [good, warning, bad, not_measured] }
              summary: { type: string, maxLength: 300 }
              observedAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        notMeasured:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/NotMeasured" }
              - type: object
                required: [kind]
                properties:
                  kind: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" }

    FileRef:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
    SnapshotHead:
      description: |
        Response, so open. Clients ignore keys they do not know, including keys under `files`.
      type: object
      required: [generatedAt, files]
      properties:
        generatedAt:
          description: |
            When this head was built, which is when its file set last changed. It is not the read time (the `Date`
            header gives that). The head stays current until it changes (see the path description).
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
        files:
          type: object
          required: [needs, work, machines]
          properties:
            needs: { $ref: "#/components/schemas/FileRef" }
            health: { $ref: "#/components/schemas/FileRef" }
            work: { $ref: "#/components/schemas/FileRef" }
            machines: { $ref: "#/components/schemas/FileRef" }
            repositories:
              description: Present when the relay serves `GET /repositories`.
              allOf: [{ $ref: "#/components/schemas/FileRef" }]
            boards:
              description: |
                Present when the relay advertises the `board` section. The index of every board (SnapshotBoards).
                Each board in it has its own key `board.<id>` below.
              allOf: [{ $ref: "#/components/schemas/FileRef" }]
            map:
              description: Present when the relay advertises the `map` section, that is, when a stage plan is configured.
              allOf: [{ $ref: "#/components/schemas/FileRef" }]
            feed:
              description: Present when the relay advertises the `feed` section. The latest 100 entries.
              allOf: [{ $ref: "#/components/schemas/FileRef" }]
            graveyard:
              description: Present when the `feed` section carries the flag `graveyard`. The latest 100 entries.
              allOf: [{ $ref: "#/components/schemas/FileRef" }]
            team:
              description: Present when the relay advertises the `team` section. Every person and their live agent sessions (SnapshotTeam).
              allOf: [{ $ref: "#/components/schemas/FileRef" }]
          patternProperties:
            "^board\\.[A-Za-z0-9_-]{1,64}$":
              description: |
                One board (SnapshotBoard), named by the `id` it has in the `boards` index. One key per board in the
                index, and no key for a board the index does not list.
              allOf: [{ $ref: "#/components/schemas/FileRef" }]
    SnapshotNeeds:
      description: |
        The caller's needs-you block, the same as `Today.needsYou`: the 20 most urgent items in the needs order.
        `nextCursor` continues in `GET /needs`. `state` and `notMeasured` say when a source could not be read, so a
        partial list is never shown as complete.
      allOf: [{ $ref: "#/components/schemas/NeedsBlock" }]
    SnapshotWork:
      description: |
        Working now and stuck, the same blocks as Today. Shipped is left out: it is relative to the person's last
        visit, and a snapshot read is never a visit.
      type: object
      required: [working, stuck]
      properties:
        working: { $ref: "#/components/schemas/WorkingBlock" }
        stuck: { $ref: "#/components/schemas/StuckBlock" }
    SnapshotBoards:
      description: |
        The index of the relay's boards, relay-wide, in display order (README, "Board and leases"). The board list is
        data, not capabilities: it changes with the relay's config, without a deploy. Each board's cards are in the
        head key `board.<id>`. Closed.
      type: object
      additionalProperties: false
      required: [boards]
      properties:
        boards:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/BoardIndexEntry" }
    BoardIndexEntry:
      type: object
      additionalProperties: false
      required: [id, title, mode, source, counts]
      properties:
        id:
          description: Unique in the index. The board's file is the head key `board.<id>`.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        title: { type: string, minLength: 1, maxLength: 60 }
        mode:
          description: |
            How the relay builds the columns. Open token; known value `dev` (the five dev columns, with leases). A
            client draws a board with an unknown mode as plain columns.
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        source:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              description: |
                Where the cards come from. Open token; known value `filter` (repositories and labels from the relay's
                config).
              allOf: [{ $ref: "#/components/schemas/OpenToken" }]
            url: { description: "A page that shows the source, when there is one.", type: string, format: uri }
        counts:
          description: Cards per column id of this board's file, after every column rule. A column with no cards may be left out.
          type: object
          maxProperties: 51
          propertyNames: { $ref: "#/components/schemas/OpenToken" }
          additionalProperties: { type: integer, minimum: 0, maximum: 1000 }
    SnapshotBoard:
      description: |
        One task board with leases. The relay computes every status, column and lease
        state; the Hub only draws them. `state` and `notMeasured` say when a source (for example the claims) could not
        be read, so a partial board is never shown as complete. A card with no `lease` and no `assignees` is Free; a
        card with a `lease` or an assignee is Taken, unless Validating, Stuck or Shipped applies. The "agent at work"
        ring is not here: the Hub derives it from the `work` file, joined by task id. A task id is relay-wide, so a
        task that two boards show is the same task on both.
      type: object
      additionalProperties: false
      required: [state, notMeasured, columns, cards]
      properties:
        state: { $ref: "#/components/schemas/BlockState" }
        notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
        columns:
          description: |
            In display order. A `dev` board has the relay's five: `free` (Free), `taken` (Taken), `validating`
            (Validating), `stuck` (Stuck) and `shipped` (Shipped). Ids are open strings with these known values.
          type: array
          maxItems: 51
          items: { $ref: "#/components/schemas/BoardColumn" }
        cards:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/BoardCard" }
    BoardColumn:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { $ref: "#/components/schemas/OpenToken" }
        title: { type: string, minLength: 1, maxLength: 40 }
    OpenToken:
      description: An open set. A lowercase token with known values documented where it is used; clients accept unknown values.
      type: string
      pattern: "^[a-z][a-z0-9_]{0,31}$"
    BoardCard:
      description: |
        Closed: an unknown field is a defect in the relay, not an extension. New card fields arrive with a new minor
        version of this schema.
      type: object
      additionalProperties: false
      required: [task, kind, column, status, statusWhy, assignees, prs, restsOn]
      properties:
        task: { $ref: "#/components/schemas/BoardTask" }
        kind: { $ref: "#/components/schemas/BoardCardKind" }
        column: { description: "A `columns[].id`.", allOf: [{ $ref: "#/components/schemas/OpenToken" }] }
        status:
          description: |
            One status vocabulary for Board, Map and Feed. Open string; known values `ruled_dead` (†), `checked` (●),
            `sent_back` (✕), `needs_you` (◆), `blocked` (⊘), `built` (◐) and `planned` (○). See README, "Board and
            leases".
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        statusWhy: { description: "One plain sentence that says why the card has this status.", type: string, minLength: 1, maxLength: 240 }
        lease: { $ref: "#/components/schemas/BoardLease" }
        lastRelease: { $ref: "#/components/schemas/LeaseLastRelease" }
        assignees: { $ref: "#/components/schemas/BoardAssignees" }
        prs: { $ref: "#/components/schemas/BoardPrs" }
        restsOn:
          description: Ids of the tasks this one rests on.
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Id" }
    BoardCardKind:
      description: |
        What the card is in its tracker. Open token; known values `issue`, `pull_request` and `draft` (a tracker item
        that belongs to no repository yet). A client shows an unknown kind like `issue`.
      allOf: [{ $ref: "#/components/schemas/OpenToken" }]
    BoardAssignees:
      description: |
        Everyone the tracker names as assigned to the task, in the tracker's order; empty when nobody is. An
        assignee is not a lease (README, "Lease protocol"): a card can have assignees and no `lease`. Any
        assignee puts an open card in Taken.
      type: array
      maxItems: 10
      items: { $ref: "#/components/schemas/PersonRef" }
    BoardTask:
      description: |
        A task as the relay names it, wherever it appears: board cards, map items, TaskRead, feed and graveyard
        entries. `openedAt` is when the tracker issue was opened; `closedAt` is when it was closed, or null while
        it is open. A relay that builds a task without a board card fills both from its own read of the issue.
      type: object
      additionalProperties: false
      required: [id, title, ref, openedAt, closedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        title: { type: string, maxLength: 300 }
        ref: { $ref: "#/components/schemas/BoardTaskRef" }
        openedAt: { $ref: "#/components/schemas/Timestamp" }
        closedAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
    BoardTaskRef:
      description: Where the task lives in its tracker; the fields of a Hub issue target.
      type: object
      additionalProperties: false
      required: [tracker, scope, key, url]
      properties:
        tracker: { description: "Open string; known: `github`.", type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" }
        host: { type: string, maxLength: 255 }
        scope: { description: "For GitHub, `owner/name`.", type: string, maxLength: 200 }
        key: { description: "For GitHub, the issue number as text.", type: string, maxLength: 100 }
        url: { type: string, format: uri }
    BoardLease:
      description: |
        Present only on a held task; a task with no lease and no assignee is Free. `state` is an open string with known values
        `active`, `stale`, `expired`, `paused`, `conflict` and `incomplete` (README, "Lease protocol": the tracker's
        assignee and `claimed` label disagree with the claim comments for longer than the 60 s settle window). A relay
        that cannot read claims says so in the board's `notMeasured`, never as a lease state. A relay only reads:
        every take, release and hand-off write comes from the Hub on the person's own login. A `claim:` or `release:`
        comment edited after it was written (`updated_at` later than `created_at`) counts for nothing (README, "Lease
        protocol").
      type: object
      additionalProperties: false
      required: [holder, state, since, lastSignalAt, staleAt, expiresAt]
      properties:
        holder: { $ref: "#/components/schemas/PersonRef" }
        state: { $ref: "#/components/schemas/OpenToken" }
        since: { description: "When the lease began: the holder's claim comment time. For an `incomplete` lease with no standing claim, the fold gives the released holder's claim time, or null when no claim comment backs it (README, \"Lease protocol\"); the fold does not choose a fallback.", allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        lastSignalAt: { description: "The last heartbeat, push or comment.", allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        staleAt: { description: "`lastSignalAt` plus 6 hours.", allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        expiresAt: { description: "`lastSignalAt` plus 24 hours.", allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
    LeaseReason:
      description: |
        Why a lease was released. Open string; known values `done`, `blocked`, `handing_over`, `out_of_usage`,
        `wrong_approach`, `duplicate`, `deprioritised` and `other`. The system-only `lost_claim` and `take_failed`
        are withdrawals, never a release reason, so they never appear here.
      allOf: [{ $ref: "#/components/schemas/OpenToken" }]
    LeaseLastRelease:
      description: |
        The latest counted release of the task (README, "Lease protocol"), present only while nobody holds a standing
        claim, and absent as soon as one stands. A later withdrawal (`lost_claim`, `take_failed`) by another claimant
        does not replace or hide it. Text is plain: a client shows `reasonText` and `note` as written and renders no markup.
      type: object
      additionalProperties: false
      required: [by, at, reason, freeToContinue]
      properties:
        by: { description: "Who released it: the holder, or a founder.", allOf: [{ $ref: "#/components/schemas/PersonRef" }] }
        at: { $ref: "#/components/schemas/Timestamp" }
        reason: { $ref: "#/components/schemas/LeaseReason" }
        freeToContinue:
          description: Line 1 of the release ends with `free to continue` (any case), and nobody is assigned to the task now. It survives a later withdrawal by another claimant.
          type: boolean
        reasonText: { description: "The text after the reason id, or the raw text of an unknown one.", type: string, minLength: 1, maxLength: 200 }
        note: { description: "The comment after line 1: Goal, Done, Next and follow-ups.", type: string, minLength: 1, maxLength: 2048 }
    BoardPrs:
      description: |
        Every pull request linked to the task, oldest first; empty when none is linked. The board status rules read
        this list (README, "Board and leases").
      type: array
      maxItems: 20
      items: { $ref: "#/components/schemas/BoardPr" }
    BoardPr:
      type: object
      additionalProperties: false
      required: [number, url, state, baseBranch, approvals, canApprove, youCanApprove]
      properties:
        number: { type: integer, minimum: 1 }
        url: { type: string, format: uri }
        state: { description: "Open string; known: `open`, `merged`, `closed`.", allOf: [{ $ref: "#/components/schemas/OpenToken" }] }
        baseBranch: { type: string, minLength: 1, maxLength: 255 }
        approvals:
          oneOf: [{ $ref: "#/components/schemas/PrApprovals" }, { type: "null" }]
        canApprove: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
        youCanApprove: { type: boolean }
        checks:
          description: The required checks on the pull request's head, when the relay has read them.
          allOf: [{ $ref: "#/components/schemas/BoardChecks" }]
    PrApprovals:
      description: Effective review rules and current approval evidence. Null on the PR when unreadable.
      type: object
      required: [required, have, codeOwners, lastPushApproval, lastPushSatisfied, stale]
      properties:
        required: { type: integer, minimum: 0 }
        have: { type: integer, minimum: 0 }
        stale: { description: Dismiss stale approvals on new commits., type: boolean }
        lastPushApproval: { description: Requires approval of the latest reviewable push., type: boolean }
        lastPushSatisfied: { type: boolean }
        codeOwners:
          type: object
          required: [required, owners]
          properties:
            required: { description: A code owner review applies to the changed files., type: boolean }
            owners: { type: array, items: { type: string, minLength: 1 } }
            satisfiedBy: { description: Present when all applicable owner reviews are satisfied., type: array, minItems: 1, items: { $ref: "#/components/schemas/PersonRef" } }
    BoardChecks:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { description: "Open string; known: `passing`, `failing`, `pending`.", allOf: [{ $ref: "#/components/schemas/OpenToken" }] }
    SnapshotMap:
      description: |
        The build map, relay-wide: the stages of a stage plan (README, "Stage plan file") with each
        item's status from the board vocabulary. The relay computes every status and counter; the Hub only draws
        them. When the plan is configured but cannot be read or is invalid, `state` is `not_measured`, `notMeasured`
        says why and `stages`, `items` and counters are empty, so a broken plan is never shown as an empty plan.
        Closed, like a board card.
      type: object
      additionalProperties: false
      required: [state, notMeasured, stages, items, counters]
      properties:
        state: { $ref: "#/components/schemas/BlockState" }
        notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
        stages:
          description: In ascending `order`.
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/MapStage" }
        items:
          description: Grouped by stage in stage order, and in plan order within a stage.
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/MapItem" }
        counters: { $ref: "#/components/schemas/MapCounters" }
    MapStage:
      type: object
      additionalProperties: false
      required: [id, title, order]
      properties:
        id: { $ref: "#/components/schemas/MapId" }
        title: { type: string, minLength: 1, maxLength: 200 }
        order: { type: integer, minimum: 0, maximum: 1000000 }
    MapId:
      description: A stable id from the stage plan.
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$"
    MapItem:
      description: |
        A `blocked` item always has a non-empty `blockedBy`. `blockedBy` may also be non-empty on an item whose own
        status outranks `blocked` (README, "Map and the stage plan").
      type: object
      additionalProperties: false
      required: [id, stageId, title, status, statusWhy, restsOn, blockedBy]
      if:
        required: [status]
        properties: { status: { const: blocked } }
      then:
        properties: { blockedBy: { minItems: 1 } }
      properties:
        id: { $ref: "#/components/schemas/MapId" }
        stageId: { description: "A `stages[].id`.", allOf: [{ $ref: "#/components/schemas/MapId" }] }
        title: { type: string, minLength: 1, maxLength: 200 }
        status:
          description: |
            The board's vocabulary: open string; known values `ruled_dead`, `checked`, `sent_back`, `needs_you`,
            `blocked`, `built` and `planned`. An item whose task has a board card takes the card's computed status,
            except that a card's `blocked` counts as the status the card has without its rests-on row. Without a card,
            a closed-completed issue is `built`, a not-planned one `ruled_dead`, an open one `planned`. An item without a
            `task` is `planned`. An item that is `built` or `planned` and has a non-empty `blockedBy` is `blocked`.
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        statusWhy: { description: "One plain sentence. For a `blocked` item it names the first entry of `blockedBy`.", type: string, minLength: 1, maxLength: 240 }
        task:
          description: The task behind the item. Always present when the plan item has a `task` ref, card or no card; absent only when it has none. Without a board card the relay builds it from the ref, and `GET /tasks/{taskId}` may answer 404 for its id.
          allOf: [{ $ref: "#/components/schemas/BoardTask" }]
        restsOn:
          description: Ids of the items this one rests on (item ids, not task ids).
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/MapId" }
        blockedBy:
          description: |
            The direct blockers: the entries of `restsOn` whose final status is `needs_you`, `sent_back`,
            `ruled_dead` or `blocked`, in `restsOn` order, without repeats. Only direct dependencies, never the root
            cause further down. Empty when nothing blocks the item.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/MapId" }
    MapCounters:
      description: Every item counted once by its final status.
      type: object
      additionalProperties: false
      required: [byStatus, byStage]
      properties:
        byStatus:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        byStage:
          description: Keyed by stage id; every stage is present.
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: integer, minimum: 0 }
    FeedPage:
      description: |
        The `feed` snapshot file and the response of `GET /feed`: newest first. The file holds the
        latest 100 entries and its `nextCursor` continues in `GET /feed?cursor=`. Entries are derived by the relay;
        a client never writes one. `nextCursor` is null on the last page.
      type: object
      additionalProperties: false
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/FeedEntry" }
        nextCursor: { type: [string, "null"] }
    FeedEntry:
      description: |
        Closed, like a board card; an unknown field is a defect in the relay. A `released` entry carries `reason`
        and `freeToContinue` (as written on line 1 of the release), and `reasonText` and `note` when the comment had
        them; no other type carries any of the four.
      type: object
      additionalProperties: false
      required: [id, type, at, importance, summary]
      if:
        properties: { type: { const: released } }
        required: [type]
      then:
        required: [reason, freeToContinue]
      else:
        not:
          anyOf:
            - required: [reason]
            - required: [freeToContinue]
            - required: [reasonText]
            - required: [note]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        type:
          description: |
            Open string. Known values: `taken`, `released`, `lease_expired`, `pr_opened`, `pr_merged`, `built`,
            `checked`, `sent_back`, `ruled_dead`, `comment`.
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        at: { $ref: "#/components/schemas/Timestamp" }
        author:
          description: Who did it, when a person did. Absent for something the relay noticed by itself.
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
        importance:
          description: "Open string. Known values: `high`, `normal`, `low`. A client sorts nothing by it; it only styles."
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        summary: { description: "One plain sentence.", type: string, minLength: 1, maxLength: 240 }
        link: { description: "Where to read more, on the tracker.", type: string, format: uri }
        task: { $ref: "#/components/schemas/BoardTask" }
        status:
          description: The task's status when the entry was made; the vocabulary of the board card.
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        reason: { $ref: "#/components/schemas/LeaseReason" }
        freeToContinue: { type: boolean }
        reasonText: { type: string, minLength: 1, maxLength: 200 }
        note: { type: string, minLength: 1, maxLength: 2048 }
    GraveyardPage:
      description: |
        The `graveyard` snapshot file and the response of `GET /graveyard`: tasks ruled dead, newest
        ruling first. The file holds the latest 100 and its `nextCursor` continues in `GET /graveyard?cursor=`.
      type: object
      additionalProperties: false
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/GraveyardEntry" }
        nextCursor: { type: [string, "null"] }
    GraveyardEntry:
      type: object
      additionalProperties: false
      required: [task, cause, ruledAt]
      properties:
        task: { $ref: "#/components/schemas/BoardTask" }
        cause: { description: "Why it was ruled dead, in the ruler's words, such as `superseded by #12`.", type: string, minLength: 1, maxLength: 500 }
        ruledAt: { $ref: "#/components/schemas/Timestamp" }
        by: { $ref: "#/components/schemas/PersonRef" }
        link: { type: string, format: uri }
    TaskRead:
      description: |
        The response of `GET /tasks/{taskId}`: every field of a board card, plus `preview` and `checked`
        when they exist. Closed.
      type: object
      additionalProperties: false
      required: [task, kind, column, status, statusWhy, assignees, prs, restsOn]
      properties:
        task: { $ref: "#/components/schemas/BoardTask" }
        kind: { $ref: "#/components/schemas/BoardCardKind" }
        column: { allOf: [{ $ref: "#/components/schemas/OpenToken" }] }
        status: { allOf: [{ $ref: "#/components/schemas/OpenToken" }] }
        statusWhy: { type: string, minLength: 1, maxLength: 240 }
        lease: { $ref: "#/components/schemas/BoardLease" }
        lastRelease: { $ref: "#/components/schemas/LeaseLastRelease" }
        assignees: { $ref: "#/components/schemas/BoardAssignees" }
        prs: { $ref: "#/components/schemas/BoardPrs" }
        restsOn:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Id" }
        preview: { $ref: "#/components/schemas/TaskPreview" }
        checked: { $ref: "#/components/schemas/TaskChecked" }
    TaskPreview:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { description: "Open string; known: `building`, `ready`, `failed`.", allOf: [{ $ref: "#/components/schemas/OpenToken" }] }
        url: { description: "Present when the preview can be opened.", type: string, format: uri }
    TaskChecked:
      description: |
        The sign-off record of a task that has a `checked` label. `valid` is true only when the rule in README,
        "Checked", holds. When it is false, `ignoredReason` says why in one plain sentence and the card's status is not
        `checked`.
      type: object
      additionalProperties: false
      required: [by, at, valid]
      properties:
        by: { description: "Who added the label.", allOf: [{ $ref: "#/components/schemas/PersonRef" }] }
        at: { description: "When the label was added.", allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        valid: { type: boolean }
        ignoredReason: { type: string, minLength: 1, maxLength: 240 }
    SnapshotMachines:
      description: |
        The caller's full `GET /machines` list in the same order, with the same visibility and `revocable` for the
        caller. `truncated` is true when the list was cut at `maxItems`; the client then pages `GET /machines`.
      type: object
      required: [items, truncated]
      properties:
        items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/Machine" } }
        truncated: { type: boolean }
    SnapshotRepositories:
      description: The full `GET /repositories` list in the same order. `truncated` works as for machines.
      type: object
      required: [items, truncated]
      properties:
        items: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Repository" } }
        truncated: { type: boolean }
    SnapshotTeam:
      description: |
        Who is working on what (README, "Team"): every non-removed member of the staff directory, including people who
        have never signed in, each with their live agent sessions. Relay-wide: every caller gets the same file. Machines come from the `machines` file and leases from
        the board files, so neither is repeated here. No field changes on every heartbeat. Closed, and no title,
        prompt, branch or path of any kind.
      type: object
      additionalProperties: false
      required: [people]
      properties:
        people: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/TeamPerson" } }
    TeamPerson:
      description: One person, in login order. A person with no live session has an empty `sessions`.
      type: object
      additionalProperties: false
      required: [id, login, role, sessions]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        login: { $ref: "#/components/schemas/Login" }
        role: { $ref: "#/components/schemas/Role" }
        sessions: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/TeamSession" } }
    TeamSession:
      description: |
        One live agent session of the person, from their machines' latest heartbeats. Stopped sessions, sessions of
        revoked machines and sessions of machines not heard from for 24 hours are left out.
      type: object
      additionalProperties: false
      required: [id, machineId, provider, state, since]
      properties:
        id:
          description: The session's `sessionId` from the facts, opaque.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        parentId:
          description: The parent session (a helper's orchestrator), present only when that session is listed too.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        machineId:
          description: The machine that reported it; the same id as in the `machines` file.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        provider:
          description: Open set. Known values `claude`, `codex`.
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        state:
          description: |
            Open set. Known values: `working` (a run is going), `waiting` (blocked on a permission or a question from
            its person, with `processRunning` true), `idle` (open, waiting for its person's next message: a fact
            `idle`, or any other `waiting`), `not_heard_from` (its machine has not been heard from for 90 seconds).
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        waiting:
          description: What a `waiting` session waits on. Present only when `state` is `waiting`.
          type: string
          enum: [permission, question]
        taskId:
          description: The board task it works on, when the relay knows it (from the fact's `taskId` or its branch).
          allOf: [{ $ref: "#/components/schemas/Id" }]
        since:
          description: When the session entered its current state. For `not_heard_from`, when its machine was last heard.
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
      allOf:
        - if: { properties: { state: { const: waiting } } }
          then: { required: [waiting] }
          else: { not: { required: [waiting] } }
    NeedsChangedEvent:
      type: object
      required: [at, count]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        count: { type: integer, minimum: 0, description: The caller's open needs-you items. }
    MentionEvent:
      type: object
      required: [at, item]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        item: { $ref: "#/components/schemas/NeedsItem" }
    BundleChangedEvent:
      type: object
      required: [at, bundleSha]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        bundleSha: { type: string, pattern: "^[0-9a-f]{40}$" }
    StaffRemovedEvent:
      type: object
      required: [at, personId]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        personId: { $ref: "#/components/schemas/Id" }
    CapabilitiesChangedEvent:
      type: object
      required: [at, capabilitiesVersion]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        capabilitiesVersion: { type: string, maxLength: 128 }
    ResetEvent:
      description: |
        The relay cannot replay from the client's `Last-Event-ID`: it no longer holds every event after that id
        (the reach is the smaller of the last 1000 events and 24 hours), or does not know the id. Sent once, instead of a replay; the client refetches `GET /today`, `GET /needs` and
        `GET /capabilities`.
      type: object
      required: [at]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
