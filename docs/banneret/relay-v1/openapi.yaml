  /pool/hosts/enroll/poll:
    post:
      tags:
      - pool
      operationId: pollPoolEnrolment
      security: []
      parameters:
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolPollRequest'
      responses:
        '200':
          description: Success.
          content:
