openapi: 3.1.0
info:
  title: Relay protocol v1
  version: "1"
  summary: The calls a Banneret Hub server makes to a central relay.
  description: |
    Every call starts from a Banneret Hub server. The relay never dials a machine and cannot run anything on one.
    Conventions (auth, signing, errors, paging, ids) are in README.md next to this file; the schema
    descriptions below repeat the binding parts.
  license:
    name: MIT
    identifier: MIT
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /relay/v1
security:
  - deviceToken: []
tags:
  - name: discovery
  - name: enrolment
  - name: machines
  - name: facts
  - name: needs
  - name: repositories
  - name: board
  - name: feed
  - name: events
  - name: snapshot
paths:
  /capabilities:
    get:
      tags: [discovery]
      operationId: getCapabilities
      summary: What this relay offers.
      description: |
        Without an `Authorization` header the relay answers 200 with only `displayName`, `iconUrl` and `enrolment`.
        With a valid signed device token it adds `sections`, `mcpTools`, `adapters` and `me`. A call
        that sends a token which fails (revoked, unknown, badly signed) is refused with 401 and its code, such as
        `token_revoked`; it never falls back to the public document. Nothing in this document is a secret. A client renders only the sections
        listed here and ignores section kinds it does not know.
      security:
        - {}
        - deviceToken: []
      responses:
        "200":
          description: The capabilities document.
          headers:
            ETag:
              description: |
                Changes whenever the document changes. It is the strong entity tag form, `capabilitiesVersion` from
                facts responses in double quotes: `capabilitiesVersion` `c-7f3a` is sent as `ETag: "c-7f3a"`.
              schema: { type: string, pattern: '^"[^"]{1,128}"$' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /enroll/start:
    post:
      tags: [enrolment]
      operationId: startEnrolment
      summary: Start enrolling this Hub server's Enterprise workspace.
      description: |
        No `Authorization` and no `X-Banneret-Device` header. The request is signed with the private half of
        `publicKey`, with counter `0`. The response carries a short confirm code for the Hub to show, and the
        browser URL the Hub opens. In that browser the person signs in through the relay's staff directory (GitHub
        organisation members by default) and types the code shown by the Hub; the code is never placed in the URL.
        The code expires after 10 minutes, or after 5 wrong codes typed for this pairing. The browser rules
        (machine details shown, the recognition tick, the optional network identity check) are in README.md,
        "Enrolment"; their outcome is reported by `POST /enroll/poll`, never as an error here. Error responses mean
        only a malformed request (400), a missing, malformed or failing signature (401), a body over 1 MiB (413),
        rate limiting (429) or an unavailable relay (503).
      security: []
      parameters:
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrolStartRequest" }
      responses:
        "200":
          description: Pairing created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolStartResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /enroll/poll:
    post:
      tags: [enrolment]
      operationId: pollEnrolment
      summary: Read the state of a pairing; on approval, receive a fresh device token until one is used.
      description: |
        Refused and expired pairings are reported here as a 200 `state` with a `reason`. Error responses mean only
        a malformed request (400), a missing, malformed or failing signature (401), an unknown pairing id
        (404 `not_found`), a body over 1 MiB (413), rate limiting (429) or an unavailable relay (503).
        No `Authorization` and no `X-Banneret-Device` header. Signed with the pairing's key, counter `0`. Poll no
        sooner than `retryAfterMs`. After approval, every poll returns a fresh `token` until a token is used, meaning
        the relay authenticates a signed call made with it. Each fresh token replaces the one before it: only the
        latest one works, and an older one is refused with 401 `unauthenticated`. After the first call the relay
        authenticates, a poll of the same pairing answers `approved` without `token`. Hub rule: a token refused with
        401 `unauthenticated` before any call made with it has succeeded means poll again for a fresh one.
      security: []
      parameters:
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrolPollRequest" }
      responses:
        "200":
          description: Current pairing state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolPollResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /machines:
    get:
      tags: [machines]
      operationId: listMachines
      summary: The Team machines list.
      description: |
        Every enrolled person sees every live (not revoked) machine of the relay, whoever owns it. A revoked machine
        is listed only to its owner and to founders, with `revokedAt` set; everyone else never sees it. Live machines
        come first, newest heartbeat first (machines never heard from last); revoked machines follow, most recently
        revoked first.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of machines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachinesPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /machines/{machineId}:
    delete:
      tags: [machines]
      operationId: revokeMachine
      summary: Revoke a machine.
      description: |
        Allowed for the machine's owner and for a founder. The machine's token is refused within 1 minute, open
        event streams from it are closed, and it leaves the Machines list of everyone except its owner and
        founders. Revoking is final; the machine enrols again to return. Revoking an already revoked machine
        answers 204. A `machineId` that is malformed (not an `Id`) or unknown answers 404 `not_found`; this call
        never answers 400.
      parameters:
        - name: machineId
          in: path
          required: true
          description: The machine's id. Not validated as an `Id` up front; a malformed value is 404 `not_found`.
          schema: { type: string }
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /facts:
    post:
      tags: [facts]
      operationId: postFacts
      summary: The heartbeat, carrying machine facts and activity facts.
      description: |
        Sent every 30 seconds and on any change. Each heartbeat carries the full current set of the machine's
        sessions; a session missing from a heartbeat has ended. A machine is "not heard from" after 90 seconds
        without a heartbeat. The body is closed: unknown fields are refused with `malformed`. It never carries
        prompts, replies, code, command text, titles, local paths or file contents. A `machine.environmentId` other
        than the environment the token's machine enrolled is refused with 403 `forbidden`. A body over 1 MiB is
        refused with 413 `too_large`.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactsRequest" }
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /today:
    get:
      tags: [needs]
      operationId: getToday
      summary: The five ordered Today blocks for the caller.
      description: |
        Blocks, in this order: needs you, shipped since the last visit, working now, stuck, health. Each block has
        its own state; one broken source affects only its own block. A block holds at most 20 items; the needs-you
        block's `nextCursor` continues in `GET /needs`.

        `lastVisitAt` is when the person last opened Today in an earlier visit, or null if they never have. The Hub
        sends `visit=1` only when the person actually opens Today. Only a read with `visit=1` can move
        `lastVisitAt`; a read without it (such as a refetch after `needs.changed`) never does. Visit reads less than
        30 minutes after the previous visit read count as one visit and leave `lastVisitAt` as it was. A visit read
        30 minutes or more after the previous one starts a new visit, and `lastVisitAt` becomes the time of the
        previous visit's last read. Any other value of `visit` is refused with 400 `malformed`.
      parameters:
        - name: visit
          in: query
          required: false
          description: Send `1` only when the person opens Today. The only accepted value is `1`.
          schema: { type: string, enum: ["1"] }
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
      responses:
        "200":
          description: Today.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Today" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /repositories:
    get:
      tags: [repositories]
      operationId: listRepositories
      summary: The company's repository list.
      description: |
        The repositories the company's workspaces are made of, in the order the relay holds them. The Hub hashes the
        git remote of each local project into a `projectKey` (see `ActivityFact`) and matches it against this list;
        no path or remote is ever sent to the relay.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of repositories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoriesPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /needs:
    get:
      tags: [needs]
      operationId: listNeeds
      summary: Needs-you items for the caller.
      description: |
        Pending questions and approvals in the caller's threads, pull requests waiting on a human, questions for a
        founder, mentions and dispatcher suggestions. Most urgent first: ordered by class, then oldest `createdAt`
        first within a class (ties in the order the relay recorded them). The classes, most urgent first, and the
        kinds in each:
          1. an agent blocked on the caller: `thread_question`, `thread_approval`;
          2. something waiting on the caller's review or decision: `pull_request`, `promotion`, `founder_question`,
             `health`;
          3. a mention, or an agent or persona writing to the caller: `mention`, `agent_message` (an agent's message
             in the person's inbox), `persona_ask` (a persona asking the person something);
          4. a dispatcher suggestion: `suggestion`;
          5. any kind not listed here, including `other`, the explicit catch-all.
        Today's needs-you block uses the same order, so its `nextCursor` continues it here.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of needs-you items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NeedsPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /feed:
    get:
      tags: [feed]
      operationId: listFeed
      summary: Older feed entries, newest first.
      description: |
        Served by a relay that advertises the `feed` section. The snapshot `feed` file holds the latest
        100 entries; this call pages through the same list from where the file stops, using the file's `nextCursor`.
        Entries are derived from tracker and relay events, never written by a client. A cursor the relay did not issue
        is 400 `malformed`.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of feed entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /graveyard:
    get:
      tags: [feed]
      operationId: listGraveyard
      summary: Older graveyard entries, newest ruling first.
      description: |
        Served by a relay that advertises the `feed` section with the flag `graveyard`. The snapshot
        `graveyard` file holds the latest 100 entries; this call continues from the file's `nextCursor`.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of graveyard entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraveyardPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /tasks/{taskId}:
    get:
      tags: [board]
      operationId: readTask
      summary: One task, with its preview and its checked sign-off.
      description: |
        Served by a relay that advertises the `task` section. Returns the board card for the task plus
        `preview` and `checked` when they exist. The Hub uses it when the task is not in the `board` or `map` file
        it holds. A `taskId` that is malformed (not an `Id`) or unknown answers 404 `not_found`; this call never
        answers 400.
      parameters:
        - name: taskId
          in: path
          required: true
          description: The task's id. Not validated as an `Id` up front; a malformed value is 404 `not_found`.
          schema: { type: string }
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskRead" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Server-sent events for the caller.
      description: |
        `text/event-stream`. Each event has an `id:` line, an `event:` line naming one of `x-sse-events` below, and
        one `data:` line holding the JSON payload. Without `Last-Event-ID` the stream is live only: it starts with
        the next event. With `Last-Event-ID` the relay replays the caller's events after that id, reaching back
        over the smaller of the last 1000 events and the last 24 hours. When the relay no longer holds every event
        after that id, or does not know the id, it sends one `reset` event instead of a replay, then continues live; on `reset` the client refetches
        `GET /today`, `GET /needs` and `GET /capabilities`. A comment line (`:`) is sent every 25 seconds. Events say what changed, never the content; the client refetches through the
        normal calls, except `mention`, which carries the needs-you item. The stream is closed when the machine is
        revoked or its person is removed.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      x-sse-events:
        needs.changed: { $ref: "#/components/schemas/NeedsChangedEvent" }
        mention: { $ref: "#/components/schemas/MentionEvent" }
        bundle.changed: { $ref: "#/components/schemas/BundleChangedEvent" }
        staff.removed: { $ref: "#/components/schemas/StaffRemovedEvent" }
        capabilities.changed: { $ref: "#/components/schemas/CapabilitiesChangedEvent" }
        reset: { $ref: "#/components/schemas/ResetEvent" }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /snapshot/head:
    get:
      tags: [snapshot]
      operationId: getSnapshotHead
      summary: The caller's current snapshot head.
      description: |
        The head names the caller's current snapshot files by SHA-256. It is per person:
        every machine of one person gets the same head. It is current when served. The relay re-checks
        time-dependent facts (a machine counts as connected only while heard within 90 seconds; a thread need
        counts only on a machine heard within 90 seconds) at least every 30 seconds. When it cannot produce a
        current head, it answers 503, never a stale one. `If-None-Match` with the current `ETag` gets 304 with no
        body. Reading the head is never a Today visit.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - name: If-None-Match
          in: header
          required: false
          description: One or more entity tags, comma-separated. Any tag equal to the current `ETag` gets 304.
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: The current head.
          headers:
            ETag:
              description: Strong tag `"sha256:<hex>"` of the exact head body. Changes only when the head changes.
              schema: { type: string, pattern: '^"sha256:[0-9a-f]{64}"$' }
            Cache-Control:
              schema: { type: string, const: "private, no-cache" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotHead" }
        "304":
          description: Unchanged. No body. Carries the same `ETag` and `Cache-Control`.
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /snapshot/files/{sha256}:
    get:
      tags: [snapshot]
      operationId: getSnapshotFile
      summary: One immutable snapshot file.
      description: |
        `sha256` is the lowercase hex of the file's SHA-256, which is the value in the head
        without its `sha256:` prefix. The body's SHA-256 always equals it, and a client may check this. A file is
        served only while one of the caller's retained heads names it (see README, Snapshot). A malformed, unknown,
        expired or someone else's hash all get the same 404 `not_found`, never 400. On 404 the client refetches the
        head once.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/Counter"
        - $ref: "#/components/parameters/SentAt"
        - $ref: "#/components/parameters/Signature"
        - name: sha256
          in: path
          required: true
          schema: { type: string }
          description: Expected `^[0-9a-f]{64}$`. Anything else answers 404, not 400.
      responses:
        "200":
          description: |
            The file. Its schema is the one its head key names: `needs` is SnapshotNeeds, `health` is HealthBlock,
            `work` is SnapshotWork, `machines` is SnapshotMachines, `repositories` is SnapshotRepositories, `board` is
            SnapshotBoard, `map` is SnapshotMap, `feed` is FeedPage, `graveyard` is GraveyardPage. The head key decides the schema, not the body (an empty list matches more than one branch, hence `anyOf`).
          headers:
            ETag:
              schema: { type: string, pattern: '^"sha256:[0-9a-f]{64}"$' }
            Cache-Control:
              schema: { type: string, const: "private, max-age=31536000, immutable" }
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: "#/components/schemas/SnapshotNeeds" }
                  - { $ref: "#/components/schemas/HealthBlock" }
                  - { $ref: "#/components/schemas/SnapshotWork" }
                  - { $ref: "#/components/schemas/SnapshotMachines" }
                  - { $ref: "#/components/schemas/SnapshotRepositories" }
                  - { $ref: "#/components/schemas/SnapshotBoard" }
                  - { $ref: "#/components/schemas/SnapshotMap" }
                  - { $ref: "#/components/schemas/FeedPage" }
                  - { $ref: "#/components/schemas/GraveyardPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <device token>`. Opaque, bound to one machine (one Hub server environment) and its
        person. Every call that carries it is also signed with the machine key (see the signature parameters).
  parameters:
    Device:
      name: X-Banneret-Device
      in: header
      required: true
      description: The relay's machine id for the caller, as returned on enrolment.
      schema: { $ref: "#/components/schemas/Id" }
    Counter:
      name: X-Banneret-Counter
      in: header
      required: true
      description: |
        Decimal integer of 1–19 digits, at most 9223372036854775807 (the int64 maximum); anything else is
        refused with `bad_signature`. `0` on enrolment calls. Otherwise time-based: the Hub's Unix time in
        milliseconds times 1000, plus a sequence number 0–999 that resets each millisecond, strictly increasing per
        machine, so a restarted Hub never reuses one. The relay keeps the 256 highest counters it accepted from
        the machine. It refuses, with `counter_reused`, a counter equal to one of them or below the lowest of them,
        and accepts any other. While it holds fewer than 256, it accepts any counter that is not a repeat.
      schema: { type: string, pattern: "^(0|[1-9][0-9]{0,18})$" }
    SentAt:
      name: X-Banneret-Sent-At
      in: header
      required: true
      description: |
        RFC 3339 UTC time of sending; refused with `clock_skew` when more than 2 minutes from the relay's clock, and
        with `bad_signature` when missing or malformed.
      schema: { $ref: "#/components/schemas/Timestamp" }
    Signature:
      name: X-Banneret-Signature
      in: header
      required: true
      description: |
        Standard base64 (with padding) of the Ed25519 signature, by the machine key, over the bytes
        `"relay/v1\n" + METHOD + "\n" + TARGET + "\n" + DEVICE + "\n" + COUNTER + "\n" + SENT_AT + "\n" + BODY`,
        where TARGET is the request target exactly as sent by the Hub (path and, when there is one, `?` and the
        query, byte for byte; proxies, including Tailscale Serve path mounts, must not rewrite it), DEVICE is the
        `X-Banneret-Device` value (empty on enrolment calls), COUNTER and SENT_AT are the header values as sent,
        and BODY is the exact request body bytes (empty when there is none). A missing or malformed signature
        header, like a missing or malformed counter or sending time, is refused with 401 `bad_signature`; a
        well-formed signature that does not verify is refused with `signature_invalid`.
      schema: { type: string, pattern: "^[A-Za-z0-9+/]{86}==$" }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`. Absent for the first page.
      schema: { type: string, minLength: 1, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    Error:
      description: |
        Any failure. 400 malformed; 401 unauthenticated, token_revoked, bad_signature, signature_invalid,
        clock_skew, counter_reused; 403 forbidden, network_identity_mismatch; 404 not_found; 413 too_large; 429 rate_limited,
        capacity (with `Retry-After`); 503 unavailable (with `Retry-After`); 500 internal.
      headers:
        Retry-After:
          description: Seconds to wait, on 429 and 503.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Id:
      description: An opaque id. Never a GitHub numeric id; never parsed by clients.
      type: string
      pattern: "^[A-Za-z0-9_-]{1,64}$"
    EnvironmentId:
      description: T3's stable per-server environment id, opaque to the relay.
      type: string
      pattern: "^[A-Za-z0-9_-]{1,128}$"
    Timestamp:
      description: RFC 3339, UTC, ending in `Z`.
      type: string
      format: date-time
      pattern: "Z$"
    Login:
      description: A display login (the person's GitHub login with the default staff directory). Display only, never a key.
      type: string
      pattern: "^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$"
    Role:
      description: |
        Open set. Known values: `founder`, `limited_staff`. Not a closed enum:
        clients treat an unknown role as `limited_staff` and never fail on it.
      type: string
      pattern: "^[a-z][a-z0-9_]{0,31}$"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              description: |
                Open set. Known values: `malformed`, `too_large`, `unauthenticated`, `token_revoked`,
                `bad_signature`, `signature_invalid`, `clock_skew`, `counter_reused`, `forbidden`,
                `network_identity_mismatch`, `not_found`, `rate_limited`, `capacity`, `unavailable`, `internal`.
                Not a closed enum: a client treats an unknown code by its
                HTTP status and never fails on it.
              type: string
              pattern: "^[a-z][a-z0-9_]{0,31}$"
            message: { type: string, maxLength: 500, description: Plain words for a person; never parsed. }
            retryable: { type: boolean }
            details:
              type: object
              description: Optional machine-readable detail, such as the refused field name. Never secrets.
    Capabilities:
      type: object
      required: [displayName, iconUrl, enrolment]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80, description: "The company's name, for \"Join <name>\"." }
        iconUrl: { type: [string, "null"], format: uri, maxLength: 2048 }
        enrolment:
          type: object
          required: [start, browser]
          properties:
            start: { type: string, const: /relay/v1/enroll/start }
            browser:
              description: Path on the relay's origin of the page where a person confirms enrolment after signing in through the staff directory.
              type: string
              pattern: "^/"
        me:
          description: The caller. Present only for an authenticated caller.
          type: object
          required: [id, login, role]
          properties:
            id: { $ref: "#/components/schemas/Id" }
            login: { $ref: "#/components/schemas/Login" }
            role: { $ref: "#/components/schemas/Role" }
            machineId: { $ref: "#/components/schemas/Id" }
        sections:
          description: Present only for an authenticated caller. The client renders only these.
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/Section" }
        mcpTools:
          description: Present only for an authenticated caller. The toolkit lists exactly these.
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/McpTool" }
        adapters:
          description: Present only for an authenticated caller. Which adapter fills each role; never configuration or secrets.
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/Adapter" }
        snapshot:
          description: Present only for an authenticated caller on a relay that serves snapshots.
          type: object
          required: [version, head]
          properties:
            version: { type: integer, minimum: 1 }
            head: { type: string, const: /relay/v1/snapshot/head }
    Section:
      type: object
      required: [id, kind, version, flags]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind:
          description: |
            One of the fixed section types: today, needs, machines, health, board, map, feed, task, channel, team,
            knowledge. Clients ignore kinds they do not know.
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        version: { type: integer, minimum: 1 }
        flags:
          type: array
          maxItems: 32
          items: { type: string, pattern: "^[a-z][a-z0-9_.]{0,63}$" }
    McpTool:
      type: object
      required: [name, description, role]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        description: { type: string, minLength: 1, maxLength: 500 }
        role:
          description: The lowest role that may call the tool.
          allOf: [{ $ref: "#/components/schemas/Role" }]
        inputSchema:
          description: JSON Schema (2020-12) for the tool's arguments.
          type: object
    Adapter:
      type: object
      required: [role, kind]
      properties:
        role: { type: string, enum: [work_tracker, staff_directory, knowledge, health] }
        kind:
          description: "`github`, `markdown`, `none`, or another compiled-in adapter."
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        version: { type: integer, minimum: 1 }
    MachineFacts:
      description: What a Hub server reports about itself. Closed; owner and last-heard time are set by the relay.
      type: object
      additionalProperties: false
      required: [environmentId, label, kind, hostname, os, hubVersion, policyFingerprint, sandbox]
      properties:
        environmentId: { $ref: "#/components/schemas/EnvironmentId" }
        label: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$" }
        kind: { type: string, enum: [laptop, desktop, server, cloud] }
        hostname: { type: string, pattern: "^[A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$" }
        os: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9 ._()-]{0,63}$" }
        hubVersion: { type: string, pattern: "^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$" }
        policyFingerprint:
          description: Fingerprint of the signed policy the machine runs, or null when it has none yet.
          oneOf:
            - { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
            - { type: "null" }
        sandbox:
          type: object
          additionalProperties: false
          required: [enabled, image]
          properties:
            enabled: { type: boolean }
            image:
              description: The pinned sandbox image reference, or null.
              oneOf:
                - { type: string, pattern: "^[a-z0-9][a-z0-9._/:-]{0,190}@sha256:[0-9a-f]{64}$" }
                - { type: "null" }
    EnrolStartRequest:
      type: object
      additionalProperties: false
      required: [publicKey, machine]
      properties:
        publicKey:
          description: Standard base64 of the machine's 32-byte Ed25519 public key.
          type: string
          pattern: "^[A-Za-z0-9+/]{43}=$"
        machine: { $ref: "#/components/schemas/MachineFacts" }
    EnrolStartResponse:
      type: object
      required: [pairingId, confirmCode, browserUrl, expiresAt, state, retryAfterMs]
      properties:
        pairingId: { $ref: "#/components/schemas/Id" }
        confirmCode:
          description: Shown by the Hub; the person types it on the relay page. Never put in a URL.
          type: string
          pattern: "^[A-Z2-7]{8}$"
        browserUrl:
          description: Absolute URL on the relay's origin that the Hub opens in the person's browser.
          type: string
          format: uri
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        state: { type: string, const: pending }
        retryAfterMs: { type: integer, minimum: 0 }
    EnrolPollRequest:
      type: object
      additionalProperties: false
      required: [pairingId]
      properties:
        pairingId: { $ref: "#/components/schemas/Id" }
    EnrolPollResponse:
      type: object
      required: [pairingId, state, expiresAt, retryAfterMs]
      properties:
        pairingId: { $ref: "#/components/schemas/Id" }
        state:
          description: |
            `pending`: waiting for the person to confirm the code (at most 10 minutes). `awaiting_approval`:
            confirmed, waiting for a founder to approve a person new to the relay (at most 7 days). `approved`,
            `refused`, `expired`: final.
          type: string
          enum: [pending, awaiting_approval, approved, refused, expired]
        expiresAt:
          description: |
            The deadline of the current state: the confirm code's expiry (10 minutes after start) while `pending`,
            the approval deadline (7 days after confirmation) while `awaiting_approval`. Once `expired`, the time it
            expired: the code's expiry for `code_expired`, the approval deadline for `approval_expired`, and the time
            of the 5th wrong code for `too_many_attempts` (the 5th wrong code expires the pairing at once). Once
            `approved` or `refused`, the deadline that was current when it became final.
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
        retryAfterMs: { type: integer, minimum: 0 }
        machineId: { $ref: "#/components/schemas/Id" }
        token:
          description: |
            The device token. Once `approved`, every poll returns a fresh one until a token is used (the relay
            authenticates a signed call made with it); each fresh token replaces the one before it, so only the
            latest one works. After that first authenticated call, polls omit it.
          type: string
          minLength: 32
          maxLength: 256
        reason:
          description: |
            Why a pairing is `refused` (`declined`, `not_staff`, `network_identity_mismatch`,
            `environment_enrolled`) or `expired` (`code_expired`, `too_many_attempts`, `approval_expired`).
          type: string
          enum: [declined, not_staff, network_identity_mismatch, environment_enrolled, code_expired, too_many_attempts, approval_expired]
      allOf:
        - if: { properties: { state: { const: approved } } }
          then: { required: [machineId] }
        - if: { properties: { state: { enum: [refused, expired] } } }
          then: { required: [reason] }
          else: { not: { required: [reason] } }
        - if: { properties: { state: { const: refused } } }
          then: { properties: { reason: { enum: [declined, not_staff, network_identity_mismatch, environment_enrolled] } } }
        - if: { properties: { state: { const: expired } } }
          then: { properties: { reason: { enum: [code_expired, too_many_attempts, approval_expired] } } }
        - if: { properties: { state: { not: { const: approved } } } }
          then: { not: { anyOf: [{ required: [token] }, { required: [machineId] }] } }
    Machine:
      type: object
      required: [id, environmentId, ownerId, ownerLogin, label, kind, hostname, os, hubVersion, policyFingerprint, sandbox, enrolledAt, lastHeardAt, connected]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        environmentId: { $ref: "#/components/schemas/EnvironmentId" }
        ownerId: { $ref: "#/components/schemas/Id" }
        ownerLogin: { $ref: "#/components/schemas/Login" }
        label: { type: string }
        kind: { type: string }
        hostname: { type: string }
        os: { type: string }
        hubVersion: { type: string }
        policyFingerprint: { type: [string, "null"] }
        sandbox:
          type: object
          required: [enabled, image]
          properties:
            enabled: { type: boolean }
            image: { type: [string, "null"] }
        enrolledAt: { $ref: "#/components/schemas/Timestamp" }
        lastHeardAt:
          description: When the relay last accepted a heartbeat, or null before the first.
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        connected: { type: boolean, description: "False after 90 seconds without a heartbeat (\"not heard from\") and once revoked." }
        revocable: { type: boolean, description: True when the caller may revoke it; false once revoked. }
        revokedAt:
          description: When the machine was revoked. Present only on a revoked machine, which only its owner and founders see.
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
    MachinesPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Machine" } }
        nextCursor: { type: [string, "null"] }
    Repository:
      description: One repository of the company's list. Closed; no path and no remote.
      type: object
      additionalProperties: false
      required: [projectKey, name]
      properties:
        projectKey:
          description: |
            `sha256:` plus the lowercase hex SHA-256 of the normalised repository identity `host/owner/name`, the same
            hash as `ActivityFact.projectKey`.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        name: { description: "Display string `owner/name`.", type: string, pattern: "^[^/\\s]{1,100}/[^/\\s]{1,100}$" }
        url:
          description: Link to the repository page.
          type: string
          format: uri
          pattern: "^https://"
          maxLength: 500
    RepositoriesPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Repository" } }
        nextCursor: { type: [string, "null"] }
    ActivityFact:
      description: One agent session, reduced to facts (company hub plan §7.4). Closed; no content of any kind.
      type: object
      additionalProperties: false
      required: [sessionId, threadId, projectKey, provider, state, processRunning, startedAt, lastSeenAt]
      properties:
        sessionId:
          description: A random id made by the Hub, not the provider's own.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        parentSessionId:
          description: The parent session, for helpers.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        threadId:
          description: T3's thread id, opaque.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        projectKey:
          description: |
            `sha256:` plus the lowercase hex SHA-256 of the repository identity `host/owner/name`, lowercased,
            without scheme, credentials, port or `.git`. Never a local path. The relay hashes its own repository
            list the same way to match it.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        branch:
          description: The git branch name only.
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$"
        taskId:
          description: The relay's task id when the Hub knows it from the toolkit; otherwise the relay derives the task from the branch.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        provider: { type: string, enum: [claude, codex] }
        providerVersion: { type: string, pattern: "^[0-9A-Za-z][0-9A-Za-z.+-]{0,31}$" }
        model: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:\\[\\]-]{0,63}$" }
        persona: { type: string, pattern: "^[a-z][a-z0-9-]{0,39}$" }
        state: { type: string, enum: [working, waiting, idle, stopped] }
        waiting:
          description: What the session waits on when `state` is `waiting`.
          type: string
          enum: [permission, question, input]
        tool:
          type: object
          additionalProperties: false
          required: [name, activity]
          properties:
            name: { description: The tool's name only., type: string, pattern: "^[A-Za-z][A-Za-z0-9_.:-]{0,63}$" }
            activity:
              type: string
              enum: [running_tests, building, editing_files, reading_files, searching, running_command, fetching, delegating, planning, other]
            fileCount: { type: integer, minimum: 0, maximum: 100000 }
            since: { $ref: "#/components/schemas/Timestamp" }
        processRunning: { type: boolean }
        startedAt: { $ref: "#/components/schemas/Timestamp" }
        lastSeenAt: { $ref: "#/components/schemas/Timestamp" }
        stopReason: { type: string, enum: [completed, usage_limit, error, killed, not_reported] }
        bundleSha: { type: string, pattern: "^[0-9a-f]{40}$" }
      allOf:
        - if: { properties: { state: { const: waiting } } }
          then: { required: [waiting] }
          else: { not: { required: [waiting] } }
        - if: { properties: { state: { const: stopped } } }
          then: { required: [stopReason] }
          else: { not: { required: [stopReason] } }
    FactsRequest:
      type: object
      additionalProperties: false
      required: [machine, activity]
      properties:
        machine: { $ref: "#/components/schemas/MachineFacts" }
        activity:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/ActivityFact" }
        usage:
          description: |
            Optional. One entry per provider login on this machine and window. Only the machine owner's own logins
            are reported. Feeds per-person usage.
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/UsageFact" }
    UsageFact:
      description: How much of one usage window a provider login has used. Closed; no tokens, costs, prompts, content or account identifiers.
      type: object
      additionalProperties: false
      required: [provider, window, usedPercent, resetsAt]
      properties:
        provider:
          description: Open set. Known values `claude` and `codex`.
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
        window:
          description: Open set. Known values `5h`, `weekly` and `monthly`.
          type: string
          pattern: "^[a-z0-9][a-z0-9_]{0,31}$"
        usedPercent: { type: number, minimum: 0, maximum: 100 }
        resetsAt:
          description: When the window resets (RFC 3339 UTC), or null when unknown.
          oneOf:
            - { $ref: "#/components/schemas/Timestamp" }
            - { type: "null" }
    FactsResponse:
      type: object
      required: [acceptedAt, heartbeatSeconds, capabilitiesVersion]
      properties:
        acceptedAt: { $ref: "#/components/schemas/Timestamp" }
        heartbeatSeconds: { type: integer, minimum: 5 }
        capabilitiesVersion:
          description: Refetch capabilities when this changes. Unquoted; the capabilities `ETag` is this value in double quotes.
          type: string
          maxLength: 128
        snapshotEtag:
          description: |
            The caller's current snapshot head `ETag`, unquoted. Refetch the head when it changes.
            Absent until the person has a head. Rebuilds are debounced, so a heartbeat's own response may still
            carry the previous value; the next heartbeat carries the new one.
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
    DeepLink:
      description: Where the item opens in a Hub. Present only when the item belongs to a thread on a known machine.
      type: object
      required: [environmentId]
      properties:
        environmentId: { $ref: "#/components/schemas/EnvironmentId" }
        threadId: { $ref: "#/components/schemas/Id" }
    PersonRef:
      type: object
      required: [id, login]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        login: { $ref: "#/components/schemas/Login" }
    NeedsItem:
      type: object
      required: [id, kind, title, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind:
          description: |
            Open set. Known values: `thread_question`, `thread_approval`, `pull_request`, `founder_question`,
            `promotion`, `health`, `mention`, `agent_message`, `persona_ask`, `suggestion`, `other` (class 5, the explicit
            catch-all). Not a closed enum:
            a client shows an unknown kind as a generic item and never fails on it.
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        title: { type: string, maxLength: 300 }
        recommendation: { type: string, maxLength: 500 }
        from: { $ref: "#/components/schemas/PersonRef" }
        url:
          description: Link out, such as the GitHub issue or pull request.
          type: string
          format: uri
        deepLink: { $ref: "#/components/schemas/DeepLink" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    NeedsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NeedsItem" } }
        nextCursor: { type: [string, "null"] }
    NotMeasured:
      type: object
      required: [source, reason, since]
      properties:
        source: { type: string, maxLength: 64 }
        reason:
          type: string
          enum: [never_read, unreachable, auth_failed, permission_missing, rate_limited, stale_publication, malformed, not_configured, too_large]
        since: { $ref: "#/components/schemas/Timestamp" }
        detail:
          description: |
            Optional. One plain sentence with the specifics, for example which stage-plan rule failed.
            Never a path or a secret.
          type: string
          maxLength: 240
    BlockState:
      type: string
      enum: [ok, partial, not_measured]
    TaskRef:
      type: object
      required: [id, title]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        title: { type: string, maxLength: 300 }
        url: { type: string, format: uri }
    Today:
      type: object
      required: [generatedAt, lastVisitAt, needsYou, shipped, working, stuck, health]
      properties:
        generatedAt: { $ref: "#/components/schemas/Timestamp" }
        lastVisitAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        needsYou: { $ref: "#/components/schemas/NeedsBlock" }
        shipped:
          type: object
          required: [state, items, notMeasured]
          properties:
            state: { $ref: "#/components/schemas/BlockState" }
            items:
              type: array
              maxItems: 20
              items:
                description: |
                  One merged pull request. `pr` is the pull request that shipped, so a client needs no board to
                  name or link it. `ref` is where the task lives in its tracker, present when the relay knows it.
                type: object
                required: [task, pr, summary, mergedAt, live]
                properties:
                  task: { $ref: "#/components/schemas/TaskRef" }
                  pr: { $ref: "#/components/schemas/ShippedPr" }
                  ref: { $ref: "#/components/schemas/BoardTaskRef" }
                  summary: { type: string, maxLength: 300 }
                  mergedAt: { $ref: "#/components/schemas/Timestamp" }
                  live: { type: string, enum: [live, not_live_yet, deploy_failed, no_deploy] }
            notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
        working: { $ref: "#/components/schemas/WorkingBlock" }
        stuck: { $ref: "#/components/schemas/StuckBlock" }
        health: { $ref: "#/components/schemas/HealthBlock" }
    ShippedPr:
      description: The pull request behind a shipped item. `repo` is the `owner/name` display string.
      type: object
      additionalProperties: false
      required: [number, url, repo]
      properties:
        number: { type: integer, minimum: 1 }
        url: { type: string, format: uri }
        repo: { type: string, minLength: 1, maxLength: 200 }
    NeedsBlock:
      description: The needs-you block, as in Today.
      type: object
      required: [state, items, nextCursor, notMeasured]
      properties:
        state: { $ref: "#/components/schemas/BlockState" }
        items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/NeedsItem" } }
        nextCursor:
          description: Continue with `GET /needs?cursor=`.
          type: [string, "null"]
        notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
    WorkingBlock:
      description: The working-now block, as in Today.
      type: object
      required: [state, items, notMeasured]
      properties:
        state: { $ref: "#/components/schemas/BlockState" }
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [person, lastActivityAt]
            properties:
              person: { $ref: "#/components/schemas/PersonRef" }
              task: { $ref: "#/components/schemas/TaskRef" }
              branch: { type: string }
              sessions: { type: integer, minimum: 0 }
              state: { type: string, enum: [working, waiting, idle, stopped, not_heard_from] }
              lastActivityAt: { $ref: "#/components/schemas/Timestamp" }
              deepLink: { $ref: "#/components/schemas/DeepLink" }
        notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
    StuckBlock:
      description: The stuck block, as in Today.
      type: object
      required: [state, items, notMeasured]
      properties:
        state: { $ref: "#/components/schemas/BlockState" }
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [rules, since]
            oneOf:
              - required: [task]
              - required: [subject]
            description: Exactly one of `task` or `subject`.
            properties:
              rules:
                description: |
                  Every stuck reason of this task and owner, most important first, in the relay's priority order
                  (README, Stuck). One item per task and owner. Never empty, never repeated.
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  enum: [dev_red, check_failed, deploy_failed, watched_job_down, unreviewed, claim_quiet, checks_queued]
              since: { $ref: "#/components/schemas/Timestamp" }
              task: { $ref: "#/components/schemas/TaskRef" }
              subject:
                description: |
                  What an item without a `task` is about. It has a repository, a watched job, or both. A watched job that
                  belongs to no repository has only `job`. An item has exactly one of `task` or `subject`. Items
                  without a task are one per subject and rule, never merged across repositories.
                type: object
                additionalProperties: false
                anyOf:
                  - required: [repo]
                  - required: [job]
                properties:
                  repo: { description: "The `owner/name` display string. No other ids.", type: string, maxLength: 200 }
                  run:
                    description: The CI run, with its URL.
                    type: object
                    additionalProperties: false
                    required: [name, url]
                    properties:
                      name: { type: string, maxLength: 200 }
                      url: { type: string, format: uri }
                  job:
                    description: The watched job. The URL is optional.
                    type: object
                    additionalProperties: false
                    required: [name]
                    properties:
                      name: { type: string, maxLength: 200 }
                      url: { type: string, format: uri }
              owner: { $ref: "#/components/schemas/PersonRef" }
              deepLink: { $ref: "#/components/schemas/DeepLink" }
        notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
    HealthBlock:
      description: The health block, as in Today. It is also the snapshot `health` file.
      type: object
      required: [state, items, notMeasured]
      properties:
        state: { $ref: "#/components/schemas/BlockState" }
        items:
          type: array
          maxItems: 20
          items:
            type: object
            required: [id, label, state, observedAt]
            properties:
              id: { $ref: "#/components/schemas/Id" }
              label: { type: string, maxLength: 120 }
              state: { type: string, enum: [good, warning, bad, not_measured] }
              summary: { type: string, maxLength: 300 }
              observedAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
    FileRef:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"
    SnapshotHead:
      description: |
        Response, so open. Clients ignore keys they do not know, including keys under `files`.
      type: object
      required: [generatedAt, files]
      properties:
        generatedAt:
          description: |
            When this head was built, which is when its file set last changed. It is not the read time (the `Date`
            header gives that). The head stays current until it changes (see the path description).
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
        files:
          type: object
          required: [needs, health, work, machines]
          properties:
            needs: { $ref: "#/components/schemas/FileRef" }
            health: { $ref: "#/components/schemas/FileRef" }
            work: { $ref: "#/components/schemas/FileRef" }
            machines: { $ref: "#/components/schemas/FileRef" }
            repositories:
              description: Present when the relay serves `GET /repositories`.
              allOf: [{ $ref: "#/components/schemas/FileRef" }]
            board:
              description: Present when the relay advertises the `board` section.
              allOf: [{ $ref: "#/components/schemas/FileRef" }]
            map:
              description: Present when the relay advertises the `map` section, that is, when a stage plan is configured.
              allOf: [{ $ref: "#/components/schemas/FileRef" }]
            feed:
              description: Present when the relay advertises the `feed` section. The latest 100 entries.
              allOf: [{ $ref: "#/components/schemas/FileRef" }]
            graveyard:
              description: Present when the `feed` section carries the flag `graveyard`. The latest 100 entries.
              allOf: [{ $ref: "#/components/schemas/FileRef" }]
    SnapshotNeeds:
      description: |
        The caller's needs-you block, the same as `Today.needsYou`: the 20 most urgent items in the needs order.
        `nextCursor` continues in `GET /needs`. `state` and `notMeasured` say when a source could not be read, so a
        partial list is never shown as complete.
      allOf: [{ $ref: "#/components/schemas/NeedsBlock" }]
    SnapshotWork:
      description: |
        Working now and stuck, the same blocks as Today. Shipped is left out: it is relative to the person's last
        visit, and a snapshot read is never a visit.
      type: object
      required: [working, stuck]
      properties:
        working: { $ref: "#/components/schemas/WorkingBlock" }
        stuck: { $ref: "#/components/schemas/StuckBlock" }
    SnapshotBoard:
      description: |
        The task board with leases, relay-wide. The relay computes every status, column and lease
        state; the Hub only draws them. `state` and `notMeasured` say when a source (for example the claims) could not
        be read, so a partial board is never shown as complete. A card with no `lease` is Free. The "agent at work"
        ring is not here: the Hub derives it from the `work` file, joined by task id.
      type: object
      additionalProperties: false
      required: [state, notMeasured, columns, cards]
      properties:
        state: { $ref: "#/components/schemas/BlockState" }
        notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
        columns:
          description: |
            The relay's five, in display order: `free` (Free), `taken` (Taken), `validating` (Validating), `stuck`
            (Stuck) and `shipped` (Shipped). Ids are open strings with these known values.
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/BoardColumn" }
        cards:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/BoardCard" }
    BoardColumn:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { $ref: "#/components/schemas/OpenToken" }
        title: { type: string, minLength: 1, maxLength: 40 }
    OpenToken:
      description: An open set. A lowercase token with known values documented where it is used; clients accept unknown values.
      type: string
      pattern: "^[a-z][a-z0-9_]{0,31}$"
    BoardCard:
      description: |
        Closed: an unknown field is a defect in the relay, not an extension. New card fields arrive with a new minor
        version of this schema.
      type: object
      additionalProperties: false
      required: [task, column, status, statusWhy, prs, restsOn]
      properties:
        task: { $ref: "#/components/schemas/BoardTask" }
        column: { description: "A `columns[].id`.", allOf: [{ $ref: "#/components/schemas/OpenToken" }] }
        status:
          description: |
            One status vocabulary for Board, Map and Feed. Open string; known values `ruled_dead` (†), `checked` (●),
            `sent_back` (✕), `needs_you` (◆), `blocked` (⊘), `built` (◐) and `planned` (○). See README, "Board and
            leases".
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        statusWhy: { description: "One plain sentence that says why the card has this status.", type: string, minLength: 1, maxLength: 240 }
        lease: { $ref: "#/components/schemas/BoardLease" }
        lastRelease: { $ref: "#/components/schemas/LeaseLastRelease" }
        prs: { $ref: "#/components/schemas/BoardPrs" }
        restsOn:
          description: Ids of the tasks this one rests on.
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Id" }
    BoardTask:
      description: |
        A task as the relay names it, wherever it appears: board cards, map items, TaskRead, feed and graveyard
        entries. `openedAt` is when the tracker issue was opened; `closedAt` is when it was closed, or null while
        it is open. A relay that builds a task without a board card fills both from its own read of the issue.
      type: object
      additionalProperties: false
      required: [id, title, ref, openedAt, closedAt]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        title: { type: string, maxLength: 300 }
        ref: { $ref: "#/components/schemas/BoardTaskRef" }
        openedAt: { $ref: "#/components/schemas/Timestamp" }
        closedAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
    BoardTaskRef:
      description: Where the task lives in its tracker; the fields of a Hub issue target.
      type: object
      additionalProperties: false
      required: [tracker, scope, key, url]
      properties:
        tracker: { description: "Open string; known: `github`.", type: string, pattern: "^[a-z][a-z0-9_]{0,31}$" }
        host: { type: string, maxLength: 255 }
        scope: { description: "For GitHub, `owner/name`.", type: string, maxLength: 200 }
        key: { description: "For GitHub, the issue number as text.", type: string, maxLength: 100 }
        url: { type: string, format: uri }
    BoardLease:
      description: |
        Present only on a held task; a task with no lease is Free. `state` is an open string with known values
        `active`, `stale`, `expired`, `paused`, `conflict` and `incomplete` (README, "Lease protocol": the tracker's
        assignee and `claimed` label disagree with the claim comments for longer than the 60 s settle window). A relay
        that cannot read claims says so in the board's `notMeasured`, never as a lease state.
      type: object
      additionalProperties: false
      required: [holder, state, since, lastSignalAt, staleAt, expiresAt]
      properties:
        holder: { $ref: "#/components/schemas/PersonRef" }
        state: { $ref: "#/components/schemas/OpenToken" }
        since: { description: "When the lease began.", allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        lastSignalAt: { description: "The last heartbeat, push or comment.", allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        staleAt: { description: "`lastSignalAt` plus 6 hours.", allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        expiresAt: { description: "`lastSignalAt` plus 24 hours.", allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
    LeaseReason:
      description: |
        Why a lease was released. Open string; known values `done`, `blocked`, `handing_over`, `out_of_usage`,
        `wrong_approach`, `duplicate`, `deprioritised` and `other`. The system-only `lost_claim` and `take_failed`
        are withdrawals, never a release reason, so they never appear here.
      allOf: [{ $ref: "#/components/schemas/OpenToken" }]
    LeaseLastRelease:
      description: |
        The latest counted release of the task (README, "Lease protocol"), present while no claim stands. Text is
        plain: a client shows `reasonText` and `note` as written and renders no markup.
      type: object
      additionalProperties: false
      required: [by, at, reason, freeToContinue]
      properties:
        by: { description: "Who released it: the holder, or a founder.", allOf: [{ $ref: "#/components/schemas/PersonRef" }] }
        at: { $ref: "#/components/schemas/Timestamp" }
        reason: { $ref: "#/components/schemas/LeaseReason" }
        freeToContinue:
          description: Written as free to continue, and nobody is assigned to the task now.
          type: boolean
        reasonText: { description: "The text after the reason id, or the raw text of an unknown one.", type: string, minLength: 1, maxLength: 200 }
        note: { description: "The comment after line 1: Goal, Done, Next and follow-ups.", type: string, minLength: 1, maxLength: 2048 }
    BoardPrs:
      description: |
        Every pull request linked to the task, oldest first; empty when none is linked. The board status rules read
        this list (README, "Board and leases").
      type: array
      maxItems: 20
      items: { $ref: "#/components/schemas/BoardPr" }
    BoardPr:
      type: object
      additionalProperties: false
      required: [number, url, state]
      properties:
        number: { type: integer, minimum: 1 }
        url: { type: string, format: uri }
        state: { description: "Open string; known: `open`, `merged`, `closed`.", allOf: [{ $ref: "#/components/schemas/OpenToken" }] }
        checks:
          description: The required checks on the pull request's head, when the relay has read them.
          allOf: [{ $ref: "#/components/schemas/BoardChecks" }]
    BoardChecks:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { description: "Open string; known: `passing`, `failing`, `pending`.", allOf: [{ $ref: "#/components/schemas/OpenToken" }] }
    SnapshotMap:
      description: |
        The build map, relay-wide: the stages of a stage plan (README, "Stage plan file") with each
        item's status from the board vocabulary. The relay computes every status and counter; the Hub only draws
        them. When the plan is configured but cannot be read or is invalid, `state` is `not_measured`, `notMeasured`
        says why and `stages`, `items` and counters are empty, so a broken plan is never shown as an empty plan.
        Closed, like a board card.
      type: object
      additionalProperties: false
      required: [state, notMeasured, stages, items, counters]
      properties:
        state: { $ref: "#/components/schemas/BlockState" }
        notMeasured: { type: array, items: { $ref: "#/components/schemas/NotMeasured" } }
        stages:
          description: In ascending `order`.
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/MapStage" }
        items:
          description: Grouped by stage in stage order, and in plan order within a stage.
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/MapItem" }
        counters: { $ref: "#/components/schemas/MapCounters" }
    MapStage:
      type: object
      additionalProperties: false
      required: [id, title, order]
      properties:
        id: { $ref: "#/components/schemas/MapId" }
        title: { type: string, minLength: 1, maxLength: 200 }
        order: { type: integer, minimum: 0, maximum: 1000000 }
    MapId:
      description: A stable id from the stage plan.
      type: string
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$"
    MapItem:
      description: |
        A `blocked` item always has a non-empty `blockedBy`. `blockedBy` may also be non-empty on an item whose own
        status outranks `blocked` (README, "Map and the stage plan").
      type: object
      additionalProperties: false
      required: [id, stageId, title, status, statusWhy, restsOn, blockedBy]
      if:
        required: [status]
        properties: { status: { const: blocked } }
      then:
        properties: { blockedBy: { minItems: 1 } }
      properties:
        id: { $ref: "#/components/schemas/MapId" }
        stageId: { description: "A `stages[].id`.", allOf: [{ $ref: "#/components/schemas/MapId" }] }
        title: { type: string, minLength: 1, maxLength: 200 }
        status:
          description: |
            The board's vocabulary: open string; known values `ruled_dead`, `checked`, `sent_back`, `needs_you`,
            `blocked`, `built` and `planned`. An item whose task has a board card takes the card's computed status,
            except that a card's `blocked` counts as the status the card has without its rests-on row. Without a card,
            a closed-completed issue is `built`, a not-planned one `ruled_dead`, an open one `planned`. An item without a
            `task` is `planned`. An item that is `built` or `planned` and has a non-empty `blockedBy` is `blocked`.
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        statusWhy: { description: "One plain sentence. For a `blocked` item it names the first entry of `blockedBy`.", type: string, minLength: 1, maxLength: 240 }
        task:
          description: The task behind the item. Always present when the plan item has a `task` ref, card or no card; absent only when it has none. Without a board card the relay builds it from the ref, and `GET /tasks/{taskId}` may answer 404 for its id.
          allOf: [{ $ref: "#/components/schemas/BoardTask" }]
        restsOn:
          description: Ids of the items this one rests on (item ids, not task ids).
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/MapId" }
        blockedBy:
          description: |
            The direct blockers: the entries of `restsOn` whose final status is `needs_you`, `sent_back`,
            `ruled_dead` or `blocked`, in `restsOn` order, without repeats. Only direct dependencies, never the root
            cause further down. Empty when nothing blocks the item.
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/MapId" }
    MapCounters:
      description: Every item counted once by its final status.
      type: object
      additionalProperties: false
      required: [byStatus, byStage]
      properties:
        byStatus:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        byStage:
          description: Keyed by stage id; every stage is present.
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: integer, minimum: 0 }
    FeedPage:
      description: |
        The `feed` snapshot file and the response of `GET /feed`: newest first. The file holds the
        latest 100 entries and its `nextCursor` continues in `GET /feed?cursor=`. Entries are derived by the relay;
        a client never writes one. `nextCursor` is null on the last page.
      type: object
      additionalProperties: false
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/FeedEntry" }
        nextCursor: { type: [string, "null"] }
    FeedEntry:
      description: |
        Closed, like a board card; an unknown field is a defect in the relay. A `released` entry carries `reason`
        and `freeToContinue` (as written on line 1 of the release), and `reasonText` and `note` when the comment had
        them; no other type carries any of the four.
      type: object
      additionalProperties: false
      required: [id, type, at, importance, summary]
      if:
        properties: { type: { const: released } }
        required: [type]
      then:
        required: [reason, freeToContinue]
      else:
        not:
          anyOf:
            - required: [reason]
            - required: [freeToContinue]
            - required: [reasonText]
            - required: [note]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        type:
          description: |
            Open string. Known values: `taken`, `released`, `lease_expired`, `pr_opened`, `pr_merged`, `built`,
            `checked`, `sent_back`, `ruled_dead`, `comment`.
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        at: { $ref: "#/components/schemas/Timestamp" }
        author:
          description: Who did it, when a person did. Absent for something the relay noticed by itself.
          allOf: [{ $ref: "#/components/schemas/PersonRef" }]
        importance:
          description: "Open string. Known values: `high`, `normal`, `low`. A client sorts nothing by it; it only styles."
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        summary: { description: "One plain sentence.", type: string, minLength: 1, maxLength: 240 }
        link: { description: "Where to read more, on the tracker.", type: string, format: uri }
        task: { $ref: "#/components/schemas/BoardTask" }
        status:
          description: The task's status when the entry was made; the vocabulary of the board card.
          allOf: [{ $ref: "#/components/schemas/OpenToken" }]
        reason: { $ref: "#/components/schemas/LeaseReason" }
        freeToContinue: { type: boolean }
        reasonText: { type: string, minLength: 1, maxLength: 200 }
        note: { type: string, minLength: 1, maxLength: 2048 }
    GraveyardPage:
      description: |
        The `graveyard` snapshot file and the response of `GET /graveyard`: tasks ruled dead, newest
        ruling first. The file holds the latest 100 and its `nextCursor` continues in `GET /graveyard?cursor=`.
      type: object
      additionalProperties: false
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/GraveyardEntry" }
        nextCursor: { type: [string, "null"] }
    GraveyardEntry:
      type: object
      additionalProperties: false
      required: [task, cause, ruledAt]
      properties:
        task: { $ref: "#/components/schemas/BoardTask" }
        cause: { description: "Why it was ruled dead, in the ruler's words, such as `superseded by #12`.", type: string, minLength: 1, maxLength: 500 }
        ruledAt: { $ref: "#/components/schemas/Timestamp" }
        by: { $ref: "#/components/schemas/PersonRef" }
        link: { type: string, format: uri }
    TaskRead:
      description: |
        The response of `GET /tasks/{taskId}`: every field of a board card, plus `preview` and `checked`
        when they exist. Closed.
      type: object
      additionalProperties: false
      required: [task, column, status, statusWhy, prs, restsOn]
      properties:
        task: { $ref: "#/components/schemas/BoardTask" }
        column: { allOf: [{ $ref: "#/components/schemas/OpenToken" }] }
        status: { allOf: [{ $ref: "#/components/schemas/OpenToken" }] }
        statusWhy: { type: string, minLength: 1, maxLength: 240 }
        lease: { $ref: "#/components/schemas/BoardLease" }
        lastRelease: { $ref: "#/components/schemas/LeaseLastRelease" }
        prs: { $ref: "#/components/schemas/BoardPrs" }
        restsOn:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Id" }
        preview: { $ref: "#/components/schemas/TaskPreview" }
        checked: { $ref: "#/components/schemas/TaskChecked" }
    TaskPreview:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { description: "Open string; known: `building`, `ready`, `failed`.", allOf: [{ $ref: "#/components/schemas/OpenToken" }] }
        url: { description: "Present when the preview can be opened.", type: string, format: uri }
    TaskChecked:
      description: |
        The sign-off record of a task that has a `checked` label. `valid` is true only when the rule in README,
        "Checked", holds. When it is false, `ignoredReason` says why in one plain sentence and the card's status is not
        `checked`.
      type: object
      additionalProperties: false
      required: [by, at, valid]
      properties:
        by: { description: "Who added the label.", allOf: [{ $ref: "#/components/schemas/PersonRef" }] }
        at: { description: "When the label was added.", allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        valid: { type: boolean }
        ignoredReason: { type: string, minLength: 1, maxLength: 240 }
    SnapshotMachines:
      description: |
        The caller's full `GET /machines` list in the same order, with the same visibility and `revocable` for the
        caller. `truncated` is true when the list was cut at `maxItems`; the client then pages `GET /machines`.
      type: object
      required: [items, truncated]
      properties:
        items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/Machine" } }
        truncated: { type: boolean }
    SnapshotRepositories:
      description: The full `GET /repositories` list in the same order. `truncated` works as for machines.
      type: object
      required: [items, truncated]
      properties:
        items: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Repository" } }
        truncated: { type: boolean }
    NeedsChangedEvent:
      type: object
      required: [at, count]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        count: { type: integer, minimum: 0, description: The caller's open needs-you items. }
    MentionEvent:
      type: object
      required: [at, item]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        item: { $ref: "#/components/schemas/NeedsItem" }
    BundleChangedEvent:
      type: object
      required: [at, bundleSha]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        bundleSha: { type: string, pattern: "^[0-9a-f]{40}$" }
    StaffRemovedEvent:
      type: object
      required: [at, personId]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        personId: { $ref: "#/components/schemas/Id" }
    CapabilitiesChangedEvent:
      type: object
      required: [at, capabilitiesVersion]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
        capabilitiesVersion: { type: string, maxLength: 128 }
    ResetEvent:
      description: |
        The relay cannot replay from the client's `Last-Event-ID`: it no longer holds every event after that id
        (the reach is the smaller of the last 1000 events and 24 hours), or does not know the id. Sent once, instead of a replay; the client refetches `GET /today`, `GET /needs` and
        `GET /capabilities`.
      type: object
      required: [at]
      properties:
        at: { $ref: "#/components/schemas/Timestamp" }
