        default:
          $ref: '#/components/responses/Error'
  /pool/hosts/facts:
    post:
      tags:
      - pool
      operationId: reportPoolFacts
      parameters:
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolHostFacts'
      responses:
        '200':
          description: The effective host ceilings and configured warning thresholds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolPolicy" }
        default:
          $ref: '#/components/responses/Error'
  /pool/hosts/next:
    post:
      tags:
      - pool
      operationId: takePoolRequest
      parameters:
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolNextRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolNextResponse'
        default:
          $ref: '#/components/responses/Error'
  /pool/sandboxes/{id}/state:
    post:
      tags:
      - pool
      operationId: reportPoolState
      description: The host supplies the current offerId. A stale or unknown offerId returns 409 stale_offer without changing the sandbox. A forbidden transition returns 403. Both state refusals include the current booking.
      parameters:
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      - in: path
        name: id
        required: true
        schema: { $ref: "#/components/schemas/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoolStateUpdate'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolSandbox'
        '403':
          description: Forbidden transition includes current. Authorization failures omit current.
          content:
            application/json:
              schema:
                oneOf:
                - { $ref: '#/components/schemas/PoolStateRefusal' }
                - allOf:
                  - { $ref: '#/components/schemas/Error' }
                  - not: { required: [current] }
        '409':
          description: Stale or unknown offerId.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoolStateRefusal' }
        default:
          $ref: '#/components/responses/Error'
  /chat/conversations:
    get:
      tags:
      - chat
      operationId: listConversations
      parameters:
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Counter'
      - $ref: '#/components/parameters/SentAt'
      - $ref: '#/components/parameters/Signature'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
