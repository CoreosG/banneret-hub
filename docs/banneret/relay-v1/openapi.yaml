            memory:
              anyOf:
              - type: object
                additionalProperties: false
                required: [sample, limit, warn]
                properties:
                  sample: {$ref: '#/components/schemas/PoolPsi'}
                  limit: {type: number, minimum: 0, maximum: 100}
                  warn: {type: boolean}
              - {type: 'null'}
            cpu:
              anyOf:
              - type: object
                additionalProperties: false
                required: [sample, limit, warn]
                properties:
                  sample: {$ref: '#/components/schemas/PoolPsi'}
                  limit: {type: number, minimum: 0, maximum: 100}
                  warn: {type: boolean}
              - {type: 'null'}
            io:
              anyOf:
              - type: object
                additionalProperties: false
                required: [sample, limit, warn]
                properties:
                  sample: {$ref: '#/components/schemas/PoolPsi'}
                  limit: {type: number, minimum: 0, maximum: 100}
                  warn: {type: boolean}
              - {type: 'null'}
    HostContention:
      type: object
      additionalProperties: false
      required: [measuredAt, notMeasured, pressure, memAvailableBytes, poolMemoryUsedBytes, poolMemoryLimitBytes, freeSlots,
        busy]
      properties:
        measuredAt: {$ref: '#/components/schemas/Timestamp'}
        notMeasured:
          anyOf:
          - {type: string, enum: [macos, windows, missing_files]}
          - {type: 'null'}
        pressure:
          type: object
          additionalProperties: false
          required: [memory, cpu, io]
          properties:
            memory: {anyOf: [{$ref: '#/components/schemas/PoolPsi'}, {type: 'null'}]}
            cpu: {anyOf: [{$ref: '#/components/schemas/PoolPsi'}, {type: 'null'}]}
            io: {anyOf: [{$ref: '#/components/schemas/PoolPsi'}, {type: 'null'}]}
        memAvailableBytes: {anyOf: [{type: integer, minimum: 0}, {type: 'null'}]}
        poolMemoryUsedBytes: {anyOf: [{type: integer, minimum: 0}, {type: 'null'}]}
        poolMemoryLimitBytes: {anyOf: [{type: integer, minimum: 0}, {type: 'null'}]}
        freeSlots: { $ref: '#/components/schemas/PoolSlots', description: "Local capacity per size minus slots in starting, running, ending or cleanup_failed." }
        busy: {type: boolean}
    PoolSandbox:
      type: object
      additionalProperties: false
      required: [id, state, place, waitSeconds, machineId, endsAt, reason]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        state:
          type: string
          enum: [waiting, offered, starting, running, ending, ended, cleanup_failed]
        place: {anyOf: [{type: integer, minimum: 0}, {type: 'null'}]}
        waitSeconds: {anyOf: [{type: integer, minimum: 0}, {type: 'null'}]}
        machineId: {anyOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
        endsAt: {anyOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
        reason: {anyOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
    PoolWorkspace:
      type: object
      additionalProperties: false
      required: [hostId, state]
      properties:
        hostId: {$ref: '#/components/schemas/Id'}
        state:
          type: string
          enum: [asked, approved, ready_to_join, active, suspended, removed]
    PoolView:
      type: object
      additionalProperties: false
      required: [hosts, me]
      properties:
        hosts:
          type: array
          items:
            type: object
            additionalProperties: false
            if: { properties: { level: { const: community } } }
            then: { properties: { holders: { maxItems: 0 }, line: { maxItems: 0 } } }
            required: [hostId, level, reporting, contention, policy, holders, line, heldCount, waitingCount]
            properties:
              hostId: {$ref: '#/components/schemas/Id'}
              level: {type: string, enum: [staff, community]}
              reporting: {type: boolean}
              policy: { anyOf: [{ $ref: '#/components/schemas/PoolLimitsPolicy', unevaluatedProperties: false }, { type: 'null' }] }
              contention: {anyOf: [{$ref: '#/components/schemas/HostContention'}, {type: 'null'}]}
              holders:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, personId, size, taskId]
                  properties:
                    id: {$ref: '#/components/schemas/Id'}
                    personId: {$ref: '#/components/schemas/Id'}
                    size: {type: string, enum: [small, large]}
                    taskId: {anyOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
              line:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, personId, size, taskId]
                  properties:
                    id: {$ref: '#/components/schemas/Id'}
                    personId: {$ref: '#/components/schemas/Id'}
                    size: {type: string, enum: [small, large]}
                    taskId: {anyOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
              heldCount: {type: integer, minimum: 0}
              waitingCount: {type: integer, minimum: 0}
        me:
          type: object
          additionalProperties: false
          required: [workspaces]
          properties:
            workspaces:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [hostId, state, resources]
                properties:
                  hostId: {$ref: '#/components/schemas/Id'}
                  state:
                    type: string
                    enum: [asked, approved, ready_to_join, active, suspended, removed]
                  resources: {anyOf: [{$ref: '#/components/schemas/PoolQuota'}, {type: 'null'}]}
    PoolWorkspaceRequest:
      type: object
      additionalProperties: false
      required: [hostId]
      properties: {hostId: {$ref: '#/components/schemas/Id'}}
    PoolSandboxRequest:
      type: object
      additionalProperties: false
      required: [hostId, size, image]
      properties:
        hostId: {$ref: '#/components/schemas/Id'}
        size: {type: string, enum: [small, large]}
        image: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        taskId: {anyOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
    PoolHostFacts:
      type: object
      additionalProperties: false
      required: [limits, sizes, contention, workspaces, running]
      properties:
        limits: {$ref: '#/components/schemas/PoolHostLimits'}
        sizes: { $ref: "#/components/schemas/PoolSizes" }
        contention: {$ref: '#/components/schemas/HostContention'}
        workspaces:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [personId, state, resources]
            properties:
              personId: {$ref: '#/components/schemas/Id'}
              state:
                type: string
                enum: [asked, approved, ready_to_join, active, suspended, removed]
              resources: {$ref: '#/components/schemas/PoolQuota'}
        running: {type: array, items: {$ref: '#/components/schemas/Id'}}
    PoolNextRequest:
      type: object
      additionalProperties: false
      required: [size]
      properties: {size: {type: string, enum: [small, large]}}
    PoolOffer:
      anyOf:
      - type: object
        additionalProperties: false
        required: [offerId, id, personId, machineId, deadline, counter, sentAt, signature, bodyBase64]
        properties:
          offerId: {$ref: '#/components/schemas/Id'}
          id: {$ref: '#/components/schemas/Id'}
          personId: {$ref: '#/components/schemas/Id'}
          machineId: {$ref: '#/components/schemas/Id'}
          deadline: {$ref: '#/components/schemas/Timestamp'}
          counter: {type: string, pattern: '^[0-9]+$'}
          sentAt: {$ref: '#/components/schemas/Timestamp'}
          signature: {type: string, pattern: '^[A-Za-z0-9+/]{86}==$'}
          bodyBase64: {type: string, contentEncoding: base64}
      - {type: 'null'}
    PoolStateUpdate:
      type: object
      additionalProperties: false
      required: [offerId, state, machineId, reason]
      properties:
        endsAt: { $ref: '#/components/schemas/Timestamp', description: Applied extension deadline. }
        offerId: {$ref: '#/components/schemas/Id'}
        state: {type: string, enum: [starting, running, ending, ended, cleanup_failed]}
        machineId: {anyOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
        reason: {anyOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
    ChatPerson:
      type: object
