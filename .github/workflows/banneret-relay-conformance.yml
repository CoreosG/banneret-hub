# Banneret Hub: runs the /relay/v1 conformance suite against the fake relay when the spec, the fake or the
# sync script changes. Upstream's CI stays disabled in this repository, so this is the only check these files get.
name: Banneret relay conformance

on:
  pull_request:
    paths:
      - docs/banneret/relay-v1/**
      - packages/banneret-relay-fake/**
      - scripts/banneret/sync-relay-spec.mjs
      - .github/workflows/banneret-relay-conformance.yml
  workflow_dispatch:

concurrency:
  group: banneret-relay-conformance-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: Fake relay conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        # The whole workspace: the shared root test config imports from scripts/, infra/ and packages/shared.
        with:
          save-pnpm-store: "false"

      - name: Typecheck
        working-directory: packages/banneret-relay-fake
        run: vp run typecheck

      - name: Conformance suite against the fake
        working-directory: packages/banneret-relay-fake
        run: vp test run --config ../../vite.config.ts --dir .
