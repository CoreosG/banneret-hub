name: Banneret release

# Builds Banneret Hub for Windows x64, Linux x64 and macOS arm64 (unsigned) plus the `banneret`
# CLI archives, and publishes them as a GitHub release tagged v<version>. Installed apps and
# remote hosts update from this repository's latest release.
#
# Run by banneret-sync.yml after a clean upstream merge, or by hand:
#   gh workflow run banneret-release.yml            (next version from scripts/banneret/next-version.mjs)
#
# The per-platform builds reuse upstream's release-desktop.yml unchanged, so packaging fixes
# arrive with each sync.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (empty: next from scripts/banneret/next-version.mjs)"
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

concurrency:
  group: banneret-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/banneret
          sparse-checkout-cone-mode: true

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*' || true
          version="${REQUESTED:-$(node scripts/banneret/next-version.mjs)}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 0.1.1200, got $version" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing Banneret Hub $version from $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  build_bundle:
    name: Build JS bundle
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # No T3 Connect: Banneret Hub ships without the official relay and Clerk sign-in.
      T3CODE_CLERK_PUBLISHABLE_KEY: ""
      T3CODE_RELAY_URL: ""
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Check Banneret identity
        run: node scripts/banneret/check-identity.mjs

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_linux_x64:
    name: Linux x64
    needs: [prepare, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true
      save_pnpm_store: false

  desktop_win_x64:
    name: Windows x64
    needs: [prepare, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true
      save_pnpm_store: false

  desktop_mac_arm64:
    name: macOS arm64
    needs: [prepare, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      save_pnpm_store: false

  publish:
    name: Publish release
    needs: [prepare, desktop_linux_x64, desktop_win_x64, desktop_mac_arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0

      - name: Download desktop builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Checksums, updater manifests and installers
        run: |
          set -euo pipefail
          node scripts/merge-release-update-manifests.ts release-assets
          node scripts/banneret/make-install-scripts.mjs release-assets
          cd release-assets
          shopt -s nullglob
          sha256sum t3-*.tar.gz t3-*.zip > SHA256SUMS
          ls -la

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          upstream="$(cat scripts/banneret/UPSTREAM_TAG)"
          cat > notes.md <<EOF
          Banneret Hub $VERSION, built on upstream T3 Code $upstream.

          Unofficial fork of the T3 Code source code; not affiliated with T3 Tools, Inc.
          Builds are unsigned: on Windows choose **More info → Run anyway**; on macOS run
          \`xattr -dr com.apple.quarantine "/Applications/Banneret Hub.app"\` once.
          EOF
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$REF" \
            --title "Banneret Hub $VERSION" \
            --notes-file notes.md \
            release-assets/*.exe release-assets/*.AppImage release-assets/*.deb \
            release-assets/*.dmg release-assets/*.zip release-assets/*.blockmap \
            release-assets/*.yml release-assets/*.tar.gz release-assets/SHA256SUMS \
            release-assets/install.sh release-assets/install.ps1
